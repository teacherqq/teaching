<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y9 GCS 課程專區 · 即將完成</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e6f1fb'/><text x='50' y='68' font-size='46' text-anchor='middle' fill='%23185fa5' font-family='serif' font-weight='bold'>G</text></svg>">
<style>
  :root{ --bg:#f7f9fc; --card:#fff; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --blue:#185fa5; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        font-family:"LXGW WenKai","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
        background:var(--bg); color:var(--ink); padding:24px; }
  .box{ max-width:560px; background:var(--card); border:1px solid var(--line); border-radius:20px;
        padding:44px 40px; text-align:center; }
  .emoji{ font-size:52px; line-height:1; }
  h1{ font-size:clamp(22px,4vw,30px); font-weight:600; margin:18px 0 10px; letter-spacing:.01em; }
  p{ font-size:16px; line-height:1.85; color:var(--muted); margin:0 0 14px; }
  .hint{ font-size:14px; color:#94a3b8; }
  .btns{ margin-top:28px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn{ display:inline-block; padding:11px 24px; border-radius:999px; font-size:15px;
        text-decoration:none; border:1px solid var(--line); background:#fff; color:var(--ink); }
  .btn.primary{ background:var(--blue); border-color:var(--blue); color:#fff; }
</style>
</head>
<body>
  <div class="box">
    <div class="emoji">📘</div>
    <h1>Y9 GCS 課程專區</h1>
    <p>這個專區正在整理中，課程內容會陸續放進來。</p>
    <p class="hint">已有的相關資源可以先從這裡進入：</p>
    <div class="btns">
      <a class="btn primary" href="../y9gcsb3/">Y9 GCS Band 3 備課資源</a>
      <a class="btn" href="../">教學工具集首頁</a>
    </div>
  </div>
</body>
</html>
