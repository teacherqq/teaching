<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九年級第三單元 · 課文動畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: rice-paper page. One big screen up top plays the chosen film; three film cards below switch it. */
:root{
  --paper:#f3ecdf; --paper-2:#e9dfcc; --card:#fbf8f1;
  --ink:#2a2420; --ink-2:#6b6055; --line:rgba(42,36,32,.14);
  --seal:#b8322a;
  --kai:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --ease:cubic-bezier(.22,.9,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:radial-gradient(120% 90% at 50% 0%,var(--card) 0%,var(--paper) 55%,var(--paper-2) 100%) fixed var(--paper);color:var(--ink)}
body{font-family:var(--sans);line-height:1.6;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:clamp(24px,5vw,56px) max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}

header{display:grid;gap:8px;justify-items:center;text-align:center;margin-bottom:clamp(18px,3.5vw,32px)}
.eyebrow{font-size:12px;letter-spacing:.32em;color:var(--ink-2);display:flex;gap:10px;align-items:center}
.eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:var(--line)}
h1{font-family:var(--kai);font-weight:700;font-size:clamp(34px,6vw,60px);letter-spacing:.1em;line-height:1.15;display:flex;align-items:center;gap:.25em}
h1 .seal{font-size:.32em;color:#fff;background:var(--seal);border-radius:4px;padding:.25em .35em;letter-spacing:0;line-height:1.1;writing-mode:vertical-rl;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.lede{font-family:var(--kai);font-size:clamp(15px,2vw,19px);color:var(--ink-2);letter-spacing:.05em}

/* screen */
.screen{background:#1c1814;border-radius:18px;padding:clamp(6px,1vw,10px);box-shadow:0 30px 60px -24px rgba(42,36,32,.55),0 0 0 1px rgba(0,0,0,.2)}
.xvid{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;cursor:pointer;outline:none}
.xvid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 600ms var(--ease),filter 300ms}
.xvid:hover img,.xvid:focus-visible img{transform:scale(1.02);filter:brightness(.92)}
.xvid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.xplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;cursor:pointer;
  font:700 clamp(16px,2.2vw,22px)/1 var(--kai);letter-spacing:.1em;color:#fff;background:rgba(184,50,42,.92);
  border-radius:999px;padding:.85em 1.6em;box-shadow:0 10px 30px -6px rgba(0,0,0,.5);transition:transform 160ms}
.xvid:hover .xplay,.xvid:focus-visible .xplay{transform:translate(-50%,-50%) scale(1.06)}
.now{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:14px 6px 6px;color:#efe7da}
.now h2{font-family:var(--kai);font-size:clamp(20px,2.8vw,28px);letter-spacing:.06em}
.now .meta{font-size:13px;color:#b8ad9f}
.now .yt{margin-left:auto;font-size:13px;color:#b8ad9f}
.now .yt a{color:#f2c9a0}

/* film cards */
.films{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(12px,2vw,20px);margin-top:clamp(20px,3.5vw,34px)}
.film{all:unset;box-sizing:border-box;display:flex;flex-direction:column;background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 0 0 1px var(--line),0 14px 30px -18px rgba(42,36,32,.45);
  transition:transform 220ms var(--ease),box-shadow 220ms}
.film:hover,.film:focus-visible{transform:translateY(-4px);box-shadow:0 0 0 1px rgba(42,36,32,.25),0 22px 40px -18px rgba(42,36,32,.55)}
.film.on{box-shadow:0 0 0 2.5px var(--seal),0 22px 40px -18px rgba(42,36,32,.55)}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#ddd}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;font-size:12px;color:#fff;background:rgba(0,0,0,.7);border-radius:6px;padding:1px 7px}
.playing{position:absolute;left:8px;top:8px;font-size:12px;color:#fff;background:var(--seal);border-radius:6px;padding:1px 8px;display:none}
.film.on .playing{display:block}
.body{padding:14px 16px 16px;display:grid;gap:6px}
.body .no{font-size:12px;letter-spacing:.2em;color:var(--ink-2)}
.body h3{font-family:var(--kai);font-size:22px;letter-spacing:.05em;line-height:1.3}
.body p{font-size:14px;color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span{font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px}

footer{margin-top:36px;text-align:center;font-size:12px;color:var(--ink-2)}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Y9 · UNIT 3</div>
    <h1>課文動畫<span class="seal">三單元</span></h1>
    <p class="lede">九年級第三單元 · 點下面的卡片切換影片，全部配繁體字幕</p>
  </header>

  <div class="screen">
    <div class="xvid" id="player" role="button" tabindex="0" aria-label="播放影片">
      <img id="poster" alt="">
      <button class="xplay" tabindex="-1">▶ 播放影片</button>
    </div>
    <div class="now">
      <h2 id="nowTitle"></h2>
      <span class="meta" id="nowMeta"></span>
      <span class="yt">播放不了？<a id="nowLink" target="_blank" rel="noopener">在 YouTube 打開</a></span>
    </div>
  </div>

  <div class="films" id="films"></div>

  <footer>旁白：ElevenLabs 合成語音 · 字型：霞鶩文楷 TC（SIL OFL 1.1） · <a href="../">回到教學工具集</a></footer>
</div>

<script>
const FILMS = [
  {yt:"o8ipNnm2lZs", img:"img/qin.webp", title:"勤能補拙", kind:"水墨動畫 · 課文朗讀", dur:"2:56",
   desc:"梅蘭芳苦練眼神、愛迪生試驗一千六百種材料、方仲永「泯然眾人」，到華羅庚「勤能補拙是良訓」：天資不足可以用勤奮彌補。",
   tags:["議論文","論點與論據"]},
  {yt:"64daNHHan_E", img:"img/tiechu.webp", title:"鐵杵真的可以磨成針嗎？", kind:"白板講解動畫", dur:"2:03",
   desc:"「只要功夫深，鐵杵磨成針」一定對嗎？勤奮不等於成功，努力有高效和低效之分：成果 ＝ 努力 × 效率。",
   tags:["議論文","反駁論證","批判性思考"]},
  {yt:"IktBvk-l-Ak", img:"img/liangxiaoer.webp", title:"兩小兒辯日", kind:"《列子》文言故事動畫", dur:"1:17",
   desc:"孔子東遊，遇到兩個小孩爭論太陽什麼時候離人近：一個看大小，一個憑冷熱，孔子也判斷不了。",
   tags:["文言文","觀察角度","求知態度"]}
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const player = $('player');
let cur = -1;

$('films').innerHTML = FILMS.map((f, i) => `
  <button class="film" data-i="${i}" aria-label="${esc(f.title)}">
    <div class="thumb"><img src="${f.img}" alt="" loading="lazy"><span class="playing">播放中</span><span class="dur">${f.dur}</span></div>
    <div class="body">
      <div class="no">第 ${i + 1} 部 · ${esc(f.kind)}</div>
      <h3>${esc(f.title)}</h3>
      <p>${esc(f.desc)}</p>
      <div class="tags">${f.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
    </div>
  </button>`).join('');

function stop(){
  const f = player.querySelector('iframe');
  if (f) f.remove();
  player.querySelectorAll('img,.xplay').forEach(e => e.hidden = false);
}
function select(i, autoplay){
  stop();
  cur = i;
  const f = FILMS[i];
  $('poster').src = f.img;
  $('nowTitle').textContent = f.title;
  $('nowMeta').textContent = `${f.kind} · ${f.dur}`;
  $('nowLink').href = `https://www.youtube.com/watch?v=${f.yt}`;
  document.querySelectorAll('.film').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  if (autoplay) play();
}
function play(){
  if (player.querySelector('iframe')) return;
  player.querySelectorAll('img,.xplay').forEach(e => e.hidden = true);
  const f = document.createElement('iframe');
  f.src = `https://www.youtube-nocookie.com/embed/${FILMS[cur].yt}?autoplay=1&rel=0`;
  f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
  f.allowFullscreen = true;
  player.appendChild(f);
}
player.addEventListener('click', play);
player.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } });
$('films').addEventListener('click', e => {
  const b = e.target.closest('.film');
  if (!b) return;
  select(+b.dataset.i, true);
  player.scrollIntoView({behavior: 'smooth', block: 'center'});
});
select(0, false);
</script>
</body></html>
