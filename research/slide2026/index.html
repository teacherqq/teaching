<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Q老師 Research｜受保護放映</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b1220'/><text x='50' y='70' font-size='52' text-anchor='middle' fill='%23d9a441' font-family='serif'>駛</text></svg>">
<style>
:root{
  --bg:#0b1220; --bg2:#111c30; --ink:#e8edf6; --soft:#a8b6cd; --muted:#6f8099;
  --accent:#d9a441; --line:rgba(255,255,255,.13); --danger:#e06c6c;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
  --serif:"KaiTi","楷体","STKaiti","BiauKai",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#1b2a45 0%,var(--bg) 60%);color:var(--ink);
  font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}

/* ---------- 密码门禁 ---------- */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;
  background:radial-gradient(1000px 600px at 50% 0%,#1b2a45 0%,#0b1220 62%);padding:24px;z-index:100}
#gate .box{width:min(430px,100%);background:rgba(255,255,255,.045);border:1px solid var(--line);
  border-radius:18px;padding:38px 34px;text-align:center;backdrop-filter:blur(8px)}
#gate .mark{width:52px;height:52px;margin:0 auto 18px;border-radius:14px;border:1.5px solid var(--accent);
  display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:var(--serif);font-size:26px}
#gate h1{margin:0 0 6px;font-size:23px;font-weight:500;letter-spacing:.02em}
#gate .sub{margin:0 0 22px;color:var(--soft);font-size:14px;line-height:1.7}
#gate .row{display:flex;gap:10px;margin-bottom:14px}
#gate input{flex:1;min-width:0;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
  background:rgba(0,0,0,.28);color:var(--ink);font-size:15px;font-family:var(--sans);outline:none;letter-spacing:.02em}
#gate input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,164,65,.16)}
#gate button{padding:12px 20px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);
  color:#20180a;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans)}
#gate button:disabled{opacity:.5;cursor:default}
#gate .err{color:var(--danger);font-size:13.5px;min-height:20px;margin:2px 0 0}
#gate .meta{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.8}
#gate .back{display:inline-block;margin-bottom:16px;color:var(--muted);text-decoration:none;font-size:13px}
#gate .back:hover{color:var(--accent)}
#gate .lbl{display:block;text-align:left;font-size:12.5px;color:var(--muted);margin:0 0 5px}
#gate input[type=text]{width:100%;margin-bottom:14px}
#gate .hint{font-size:12px;color:var(--muted);margin:-6px 0 12px;text-align:left;line-height:1.6}

/* ---------- 放映区 ---------- */
#stage{position:fixed;inset:0;display:none;flex-direction:column}
#stage.on{display:flex}
#top{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);
  background:rgba(6,12,22,.7);backdrop-filter:blur(10px);flex:0 0 auto;z-index:10}
#top .ttl{font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .who{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
#whoTag{display:inline-block;padding:2px 9px;border:1px solid var(--line);border-radius:999px;color:var(--accent);
  font-size:12px;margin-right:8px;vertical-align:middle;cursor:pointer}
#whoTag:hover{border-color:var(--accent);background:rgba(217,164,65,.1)}
#top .ib{all:unset;cursor:pointer;width:32px;height:32px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;color:var(--soft);font-size:16px}
#top .ib:hover{background:rgba(255,255,255,.08);color:var(--ink)}
#top .ib:disabled{opacity:.3;cursor:default}
#top a.ib{text-decoration:none;color:var(--soft)}
#top a.ib:hover{color:var(--accent);background:rgba(255,255,255,.08)}
#view{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:18px;min-height:0}
#canvas{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px -24px rgba(0,0,0,.85);
  background:#0d1524;opacity:0;transition:opacity .28s}
#canvas.ready{opacity:1}
#wm{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wm span{position:absolute;white-space:nowrap;font-size:14px;color:rgba(255,255,255,.10);
  transform:rotate(-26deg);letter-spacing:.14em;font-family:var(--sans)}
#guard{position:fixed;inset:0;background:rgba(6,10,18,.97);z-index:80;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:30px}
#guard.on{display:flex}
#guard .i{font-size:34px}
#guard p{margin:0;color:var(--soft);font-size:15px;line-height:1.8}
#guard small{color:var(--muted);font-size:12.5px}
#bottom{height:48px;display:flex;align-items:center;gap:14px;padding:0 16px;border-top:1px solid var(--line);
  background:rgba(6,12,22,.7);backdrop-filter:blur(10px);flex:0 0 auto;z-index:10}
#bottom button{all:unset;cursor:pointer;padding:7px 15px;border-radius:8px;border:1px solid var(--line);
  color:var(--soft);font-size:13.5px}
#bottom button:hover:not(:disabled){background:rgba(255,255,255,.07);color:var(--ink)}
#bottom button:disabled{opacity:.3;cursor:default}
#pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;cursor:pointer;position:relative}
#barIn{height:100%;background:var(--accent);width:0;border-radius:2px}
#hint{font-size:12px;color:var(--muted);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(10,16,26,.94);
  border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:13px;color:var(--soft);
  z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (max-width:640px){
  #top .ttl{display:none} #hint{display:none} #top .who{font-size:11px}
  #view{padding:10px}
}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <a class="back" href="../">← Q老師 Research</a>
    <div class="mark">駛</div>
    <h1>Q老師 Research</h1>
    <p class="sub">驭AI以文 · 一线教师数字素养以及中文课堂 AI 案例实操<br>共 45 页 · 受保護放映</p>
    <label class="lbl" for="who">你的姓名或邮箱（嵌入水印，供追踪外传）</label>
    <input id="who" type="text" placeholder="例：陈老师 / teacher@school.edu" autocomplete="off" spellcheck="false">
    <label class="lbl" for="pwd">访问密码</label>
    <div class="row">
      <input id="pwd" type="password" placeholder="输入访问密码" autocomplete="off" spellcheck="false">
      <button id="go">进入</button>
    </div>
    <p class="hint">姓名将以水印形式覆盖在每一页画面上，请如实填写。</p>
    <p class="err" id="err"></p>
    <div class="meta">内容已加密存放，请勿截图或转发<br>如需访问请联系 Ms Qian</div>
  </div>
</div>

<div id="stage">
  <div id="top">
    <button class="ib" id="prev" title="上一页">‹</button>
    <button class="ib" id="next" title="下一页">›</button>
    <span class="ttl">Q老師 Research · 驭AI以文</span>
    <a class="ib" href="../" title="返回 Q老師 Research">←</a>
    <span class="who"><span id="whoTag"></span>受保護放映</span>
  </div>
  <div id="view">
    <canvas id="canvas"></canvas>
    <div id="wm"></div>
  </div>
  <div id="bottom">
    <button id="first">首页</button>
    <button id="pp" title="上一页">←</button>
    <button id="np" title="下一页">→</button>
    <button id="last">末页</button>
    <span id="pos">— / 45</span>
    <div id="bar"><div id="barIn"></div></div>
    <span id="hint">← → 翻页 · F 全屏 · 双击放大</span>
  </div>
</div>

<div id="guard">
  <div class="i">🔒</div>
  <p>内容已暂停显示</p>
  <small>窗口失去焦点时自动隐藏，点击任意处恢复</small>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ============ 基础防护 ============ */
const toastEl=document.getElementById('toast');
let toastT;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2200)}

// 禁止右键菜单
document.addEventListener('contextmenu',e=>e.preventDefault(),true);
// 禁止拖拽
document.addEventListener('dragstart',e=>e.preventDefault(),true);
// 禁止选中
document.addEventListener('selectstart',e=>e.preventDefault(),true);
// 禁止复制/剪切
['copy','cut'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),true));
// 拦截打印/保存/开发者工具等快捷键
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&['s','p','u','i','j','c'].includes(k)){e.preventDefault();toast('此内容受保护，该操作已禁用');return}
  if(e.key==='PrintScreen'){e.preventDefault();toast('已禁用截图快捷键');return}
  if(e.key==='F12'){e.preventDefault();return}
  if(e.key==='ContextMenu'){e.preventDefault();return}
},{capture:true});
// 拦截 beforeprint（Cmd+P 打印时清空画布）
window.addEventListener('beforeprint',()=>{const c=document.getElementById('canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)});

/* ============ 状态 ============ */
let key=null, idx=0, pages=[], META=null, busy=false;
const cv=document.getElementById('canvas'), ctx=cv.getContext('2d');
const stage=document.getElementById('stage'), gate=document.getElementById('gate');

/* ============ Web Crypto 工具 ============ */
function b64ToBuf(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function deriveKey(password,saltB64,iter){
  const salt=b64ToBuf(saltB64);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function decryptPage(key,buf){
  const u=new Uint8Array(buf);
  const magic=String.fromCharCode(...u.slice(0,4));
  if(magic!=='SLD1') throw new Error('bad magic');
  const iv=u.slice(4,16), tag=u.slice(16,32), ct=u.slice(32);
  // Web Crypto 要求 GCM 的 tag 附在密文末尾
  const payload=new Uint8Array(ct.length+16);
  payload.set(ct,0); payload.set(tag,ct.length);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,tagLength:128},key,payload);
  return new Blob([plain],{type:'image/jpeg'});
}

/* ============ 水印 ============ */
let who='';
const WHO_KEY='qr_who_slide';
try{localStorage.removeItem('qr_who')}catch(e){}   // 清理早期測試殘留的舊鍵   // 與影片頁分開存儲，避免互相污染
function wmLabel(){ return who?`錢老師 · ${who} · 受保護放映 · 請勿截圖`:'錢老師 · 受保護放映 · 請勿截圖'; }
function buildWatermark(label){
  const wm=document.getElementById('wm');
  wm.innerHTML='';
  const n=9;
  for(let i=0;i<n;i++){
    const s=document.createElement('span');
    s.textContent=label;
    const row=Math.floor(i/3),col=i%3;
    s.style.left=(-10+col*36)+'%';
    s.style.top=(-6+row*40+i*2)+'%';
    wm.appendChild(s);
  }
}
function stampOnCanvas(label){
  // 在画布像素上烧录水印 —— 截图/另存都无法去除
  const w=cv.width,h=cv.height;
  const fs=Math.max(18,Math.round(h/26));
  ctx.save();
  ctx.translate(w/2,h/2);
  ctx.rotate(-26*Math.PI/180);
  ctx.font=`600 ${fs}px ${getComputedStyle(document.body).fontFamily}`;
  ctx.textAlign='center';
  const step=Math.max(240,Math.round(h/4));
  ctx.lineJoin='round';
  for(let y=-h;y<h;y+=step){
    for(let x=-w;x<w;x+=step*5){
      // 深色描边 + 浅色描边，保证深浅背景都可见
      ctx.globalAlpha=0.30; ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=Math.max(2,fs/9);
      ctx.strokeText(label,x,y);
      ctx.globalAlpha=0.34; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=Math.max(2,fs/10);
      ctx.strokeText(label,x,y);
      ctx.globalAlpha=0.16; ctx.fillStyle='#fff';
      ctx.fillText(label,x,y);
    }
  }
  ctx.restore();
}

/* ============ 渲染 ============ */
async function show(i){
  if(!key||busy) return;
  if(i<0||i>=pages.length) return;
  busy=true;idx=i;
  const url='assets/'+pages[i];
  try{
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('http '+res.status);
    const buf=await res.arrayBuffer();
    const blob=await decryptPage(key,buf);
    const bmp=await createImageBitmap(blob);
    const MAXW=1920;
    if(bmp.width>MAXW){cv.width=MAXW;cv.height=Math.round(bmp.height*MAXW/bmp.width)}
    else{cv.width=bmp.width;cv.height=bmp.height}
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(bmp,0,0,cv.width,cv.height);
    bmp.close&&bmp.close();
    stampOnCanvas(wmLabel());
    cv.classList.add('ready');
    updateBar();
  }catch(e){
    toast('这一页解密失败：'+e.message);
  }finally{busy=false}
}
function updateBar(){
  document.getElementById('pos').textContent=(idx+1)+' / '+pages.length;
  document.getElementById('barIn').style.width=((idx+1)/pages.length*100)+'%';
  document.getElementById('prev').disabled=idx===0;
  document.getElementById('first').disabled=idx===0;
  document.getElementById('next').disabled=idx===pages.length-1;
  document.getElementById('last').disabled=idx===pages.length-1;
}
const WATERMARK='錢老師 · 受保護放映 · 請勿截圖';
// 顶栏「姓名」可点击修改，便于随时更正或清除
document.getElementById('top').addEventListener('click',e=>{
  if(e.target.closest('#whoTag')){
    const n=prompt('请输入你的姓名或邮箱（会嵌入水印）\n若要清除，请直接按确定键并留空。',who);
    if(n!==null){
      who=n.trim();
      if(who) localStorage.setItem(WHO_KEY,who); else localStorage.removeItem(WHO_KEY);
      document.getElementById('whoTag').textContent=who||'已解锁';
      buildWatermark(wmLabel());
      if(key) show(idx);
    }
  }
});

document.getElementById('prev').onclick=()=>show(idx-1);
document.getElementById('next').onclick=()=>show(idx+1);
document.getElementById('first').onclick=()=>show(0);
document.getElementById('last').onclick=()=>show(pages.length-1);
document.getElementById('pp').onclick=()=>show(idx-1);
document.getElementById('np').onclick=()=>show(idx+1);
document.getElementById('bar').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  const p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  show(Math.floor(p*pages.length));
};
document.addEventListener('keydown',e=>{
  if(gate.style.display!=='none'&&gate.offsetParent!==null) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();show(idx+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(idx-1)}
  else if(e.key==='Home'){e.preventDefault();show(0)}
  else if(e.key==='End'){e.preventDefault();show(pages.length-1)}
  else if(e.key==='f'||e.key==='F'){
    if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});
  }
});
// 触摸滑动
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)) show(dx<0?idx+1:idx-1);
},{passive:true});

/* ============ 失焦护盾 ============ */
const guard=document.getElementById('guard');
let guardOn=false;
function setGuard(on){
  if(on===guardOn)return;guardOn=on;
  guard.classList.toggle('on',on);
  if(on){ctx.clearRect(0,0,cv.width,cv.height);cv.classList.remove('ready')}
  else if(key) show(idx);
}
window.addEventListener('blur',()=>setGuard(true));
window.addEventListener('focus',()=>setGuard(false));
document.addEventListener('visibilitychange',()=>setGuard(document.hidden));
guard.addEventListener('click',()=>setGuard(false));

/* ============ 进入流程 ============ */
const pwdEl=document.getElementById('pwd'), goEl=document.getElementById('go'), errEl=document.getElementById('err');
const whoEl=document.getElementById('who');
whoEl.value=localStorage.getItem(WHO_KEY)||'';
async function enter(){
  const p=pwdEl.value.trim();
  if(!p){errEl.textContent='请输入密码';return}
  goEl.disabled=true;errEl.textContent='';
  try{
    const res=await fetch('manifest.json',{cache:'no-store'});
    META=await res.json();
    const k=await deriveKey(p,META.salt,META.iter);
    // 用第一页验证密码（解密失败即密码错误）
    const r=await fetch('assets/'+META.pages[0],{cache:'no-store'});
    await decryptPage(k,await r.arrayBuffer());
    key=k;pages=META.pages;
    who=whoEl.value.trim();
    localStorage.setItem(WHO_KEY,who);
    buildWatermark(wmLabel());
    document.getElementById('whoTag').textContent=who||'已解锁';
    gate.style.display='none';
    stage.classList.add('on');
    await show(0);
  }catch(e){
    errEl.textContent='密码不正确，请重试';
    pwdEl.select();
  }finally{
    goEl.disabled=false;
  }
}
goEl.onclick=enter;
pwdEl.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
pwdEl.focus();
</script>
</body>
</html>
