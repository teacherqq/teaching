<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q老師 Research｜知行合一</title>
<meta name="description" content="AI 原生教師與 vibe coding 教學網站的介紹影片。">
<style>
  :root{--bg:#e9e3d7;--bg2:#d9cfbe;--ink:#1f232a;--soft:#4b4f56;--muted:#857d70;--line:rgba(60,45,25,.14);--accent:#a8672a;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#f1ece3 0%,var(--bg) 45%,var(--bg2) 100%) var(--bg);min-height:100vh;color:var(--ink);font-family:var(--sans);line-height:1.6}
  header{max-width:1200px;margin:0 auto;padding:48px 24px 8px}
  .back{color:var(--muted);text-decoration:none;font-size:14px}
  .back:hover{color:var(--accent)}
  h1{margin:14px 0 6px;font-size:clamp(26px,4vw,38px);letter-spacing:.02em}
  .sub{color:var(--soft);margin:0}
  main{max-width:1100px;margin:0 auto;padding:12px 24px 64px}
  .sec{margin-top:28px}
  .sec-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .glyph{font-family:"KaiTi","楷体","STKaiti","BiauKai",serif;font-size:40px;line-height:1;color:var(--accent);width:56px;height:56px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--accent);border-radius:12px}
  .sec-head h2{margin:0;font-size:20px}
  .sec-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
  .card{all:unset;cursor:pointer;display:flex;flex-direction:column;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 22px -16px rgba(60,45,25,.5);transition:transform .15s,box-shadow .15s}
  .card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 14px 28px -16px rgba(60,45,25,.6)}
  .card:focus-visible{outline:2px solid var(--accent)}
  .thumb{position:relative;display:block;aspect-ratio:16/9;background:#222}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .play{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(20,20,20,.62)}
  .play::after{content:"";position:absolute;left:18px;top:14px;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
  .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:1px 6px;border-radius:4px}
  .num{padding:10px 14px 0;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.12em}
  .title{padding:2px 14px 14px;font-size:15px;font-weight:600;line-height:1.45}
  .lb{position:fixed;inset:0;background:#0a0a0c;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
  .lb[hidden]{display:none}
  .lb-box{position:relative;width:min(1200px,100%)}
  .lb video{width:100%;max-height:82vh;background:#000;border-radius:8px;display:block}
  .lb-title{color:#eee;margin-top:10px;font-size:15px}
  .close{all:unset;cursor:pointer;position:absolute;right:-6px;top:-44px;color:#fff;font-size:34px;line-height:1;padding:4px 10px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:0 0 40px}

  /* ---------- 浮水印 + 保護 ---------- */
  #wm{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
  #wm span{position:absolute;white-space:nowrap;font-size:16px;color:rgba(0,0,0,.28);
    transform:rotate(-24deg);letter-spacing:.1em;font-weight:600;
    text-shadow:0 0 6px rgba(255,255,255,.9),0 1px 2px rgba(255,255,255,.85)}
  #pgwm{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  #pgwm span{position:absolute;white-space:nowrap;font-size:16px;color:rgba(60,45,25,.11);
    transform:rotate(-24deg);letter-spacing:.1em;font-weight:500}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(30,28,24,.93);
    color:#f0e9dc;border-radius:999px;padding:8px 18px;font-size:13px;z-index:96;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.on{opacity:1}
  .privlink{display:inline-block;margin-top:6px;font-size:13px;color:var(--accent);text-decoration:none;
    border:1px solid rgba(168,103,42,.45);border-radius:999px;padding:3px 12px}
  .privlink:hover{background:rgba(168,103,42,.10)}
</style>
</head>
<body>
<header>
  <a class="back" href="../">← 教學工具集</a>
  <h1>Q老師 Research</h1>
  <p class="sub">知行合一</p>
  <p style="margin:12px 0 0"><a class="privlink" href="private/">🔒 受保護放映（需密碼）· 驭AI以文幻燈片</a></p>
</header>
<main>
<section class="sec">
  <div class="sec-head"><span class="glyph">知</span><div><h2>知 · 理念</h2><p>關於 AI 原生教師、建什麼庫的思考。</p></div></div>
  <div class="grid">
  <button class="card" data-src="videos/ai-native-teacher.mp4" data-title="AI 原生教師">
    <span class="thumb"><img src="videos/ai-native-teacher.jpg" alt="" loading="lazy"><span class="play"></span><span class="dur">2:14</span></span>
    <span class="num">01</span><span class="title">AI 原生教師</span>
  </button>
  <button class="card" data-src="videos/establish-what-db.mp4" data-title="建立什麼庫？">
    <span class="thumb"><img src="videos/establish-what-db.jpg" alt="" loading="lazy"><span class="play"></span><span class="dur">2:11</span></span>
    <span class="num">02</span><span class="title">建立什麼庫？</span>
  </button>
  </div>
</section>
<section class="sec">
  <div class="sec-head"><span class="glyph">行</span><div><h2>行 · 實踐</h2><p>用 vibe coding 做出來的教學網站與工作流。</p></div></div>
  <div class="grid">
  <button class="card" data-src="videos/vocab-website-animated.mp4" data-title="Vibe Coding 詞彙網站（動畫版）">
    <span class="thumb"><img src="videos/vocab-website-animated.jpg" alt="" loading="lazy"><span class="play"></span><span class="dur">2:19</span></span>
    <span class="num">01</span><span class="title">Vibe Coding 詞彙網站（動畫版）</span>
  </button>
  <button class="card" data-src="videos/literature-anlexiang.mp4" data-title="Vibe Coding 文學作品學習網站：安樂鄉的一日（設計版）">
    <span class="thumb"><img src="videos/literature-anlexiang.jpg" alt="" loading="lazy"><span class="play"></span><span class="dur">4:01</span></span>
    <span class="num">02</span><span class="title">Vibe Coding 文學作品學習網站：安樂鄉的一日（設計版）</span>
  </button>
  <button class="card" data-src="videos/learning-data-dashboard.mp4" data-title="Vibe Coding 學習數據看板介紹">
    <span class="thumb"><img src="videos/learning-data-dashboard.jpg" alt="" loading="lazy"><span class="play"></span><span class="dur">2:53</span></span>
    <span class="num">03</span><span class="title">Vibe Coding 學習數據看板介紹</span>
  </button>
  <button class="card" data-src="videos/real-question-bank.mp4" data-title="以真題庫為例：寫作真題庫一鍵匯總">
    <span class="thumb"><img src="videos/real-question-bank.jpg" alt="" loading="lazy"><span class="play"></span><span class="dur">3:03</span></span>
    <span class="num">04</span><span class="title">以真題庫為例：寫作真題庫一鍵匯總</span>
  </button>
  <button class="card" data-src="videos/ai-skill-vibecoding2.mp4" data-title="中文老師的 AI Skill 與 Vibe Coding ②">
    <span class="thumb"><img src="videos/ai-skill-vibecoding2.jpg" alt="" loading="lazy"><span class="play"></span><span class="dur">4:52</span></span>
    <span class="num">05</span><span class="title">中文老師的 AI Skill 與 Vibe Coding ②</span>
  </button>
  </div>
</section>
</main>
<div class="lb" id="lb" hidden><div class="lb-box"><button class="close" aria-label="關閉">×</button><div id="lbStage" style="position:relative"><video id="lbv" controls playsinline></video><div id="wm"></div></div><div class="lb-title" id="lbt"></div></div></div>
<div id="pgwm"></div>
<div id="toast"></div>
<footer>teacherqq · teaching / research</footer>
<script>
/* ---------- 浮水印 ---------- */
const WM_LABEL='錢老師 · Q老師 Research · 請勿轉傳';
function fillWatermark(){
  const wm=document.getElementById('wm');wm.innerHTML='';
  for(let i=0;i<7;i++){
    const s=document.createElement('span');s.textContent=WM_LABEL;
    s.style.left=(-14+(i%3)*38)+'%';s.style.top=(-4+Math.floor(i/3)*46+i*3)+'%';
    wm.appendChild(s);
  }
  const pg=document.getElementById('pgwm');pg.innerHTML='';
  for(let i=0;i<14;i++){
    const s=document.createElement('span');s.textContent=WM_LABEL;
    s.style.left=(-16+(i%4)*30)+'%';s.style.top=(-6+Math.floor(i/4)*30+i*2)+'%';
    pg.appendChild(s);
  }
}
fillWatermark();

/* ---------- 基礎防護 ---------- */
const toastEl=document.getElementById('toast');let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2200)}
document.addEventListener('contextmenu',e=>e.preventDefault(),true);
document.addEventListener('dragstart',e=>e.preventDefault(),true);
document.addEventListener('selectstart',e=>e.preventDefault(),true);
['copy','cut'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),true));
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&['s','p','u','i','j','c'].includes(k)){e.preventDefault();toast('請勿下載或轉傳此內容');return}
  if(e.key==='PrintScreen'){e.preventDefault();toast('請勿截圖轉傳此內容');return}
  if(e.key==='F12'||e.key==='ContextMenu'){e.preventDefault()}
},{capture:true});
window.addEventListener('beforeprint',()=>{const v=document.getElementById('lbv');if(v)v.style.visibility='hidden'});

/* ---------- 播放器 ---------- */
const lb=document.getElementById('lb'),v=document.getElementById('lbv'),t=document.getElementById('lbt');
function close(){if(document.fullscreenElement)document.exitFullscreen();v.pause();v.removeAttribute('src');v.load();lb.hidden=true;document.getElementById('pgwm').style.display=''}
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{
  v.src=c.dataset.src;t.textContent=c.dataset.title;lb.hidden=false;
  document.getElementById('pgwm').style.display='none';
  v.play().catch(()=>{});
  const fs=v.requestFullscreen||v.webkitRequestFullscreen;
  if(fs)fs.call(v).catch?.(()=>{});else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();
}));
lb.querySelector('.close').onclick=close;
lb.addEventListener('click',e=>{if(e.target===lb)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!lb.hidden&&!document.fullscreenElement)close()});
</script>
</body>
</html>
