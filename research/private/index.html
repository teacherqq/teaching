<style>
  :root{--bg:#e9e3d7;--bg2:#d9cfbe;--ink:#1f232a;--soft:#4b4f56;--muted:#857d70;--line:rgba(60,45,25,.14);--accent:#a8672a;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#f1ece3 0%,var(--bg) 45%,var(--bg2) 100%) var(--bg);min-height:100vh;color:var(--ink);font-family:var(--sans);line-height:1.6}
  header{max-width:1200px;margin:0 auto;padding:48px 24px 8px}
  /* 未解鎖時整個內容區隱藏 */
  body.locked header,body.locked main,body.locked footer,body.locked #pgwm{display:none}
  .back{color:var(--muted);text-decoration:none;font-size:14px}
  .back:hover{color:var(--accent)}
  h1{margin:14px 0 6px;font-size:clamp(26px,4vw,38px);letter-spacing:.02em}
  .sub{color:var(--soft);margin:0}
  main{max-width:1100px;margin:0 auto;padding:12px 24px 64px}
  .sec{margin-top:28px}
  .sec-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .glyph{font-family:"KaiTi","楷体","STKaiti","BiauKai",serif;font-size:40px;line-height:1;color:var(--accent);width:56px;height:56px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--accent);border-radius:12px}
  .sec-head h2{margin:0;font-size:20px}
  .sec-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
  .card{all:unset;cursor:pointer;display:flex;flex-direction:column;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 22px -16px rgba(60,45,25,.5);transition:transform .15s,box-shadow .15s}
  .card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 14px 28px -16px rgba(60,45,25,.6)}

  .num{padding:10px 14px 0;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.12em}
  .title{padding:2px 14px 14px;font-size:15px;font-weight:600;line-height:1.45}
  .lb{position:fixed;inset:0;background:#0a0a0c;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
  .lb[hidden]{display:none}
  .lb-box{position:relative;width:min(1200px,100%)}
  .lb video{width:100%;max-height:82vh;background:#000;border-radius:8px;display:block}
  .lb-title{color:#eee;margin-top:10px;font-size:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .lb-title .wmwho{font-size:12px;color:#d9a441;border:1px solid rgba(217,164,65,.5);border-radius:999px;padding:1px 10px}
  .close{all:unset;cursor:pointer;position:absolute;right:-6px;top:-44px;color:#fff;font-size:34px;line-height:1;padding:4px 10px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:0 0 40px}

  /* ---------- 水印（影片播放时叠加） ---------- */
  #wm{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
  #wm span{position:absolute;white-space:nowrap;font-size:16px;color:rgba(0,0,0,.30);
    transform:rotate(-24deg);letter-spacing:.1em;font-weight:600;
    text-shadow:0 0 6px rgba(255,255,255,.9),0 1px 2px rgba(255,255,255,.85)}
  /* 頁面級水印（整頁覆蓋，含卡片區） */
  #pgwm{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  #pgwm span{position:absolute;white-space:nowrap;font-size:16px;color:rgba(60,45,25,.10);
    transform:rotate(-24deg);letter-spacing:.1em;font-weight:500}
  /* ---------- 密碼門禁 ---------- */
  #gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1000px 620px at 50% 0%,#f3ece0 0%,#e2d9c8 55%,#d3c6b0 100%);padding:24px}

  #gate input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.75);
    color:var(--ink);font-size:15px;font-family:var(--sans);outline:none;margin-bottom:14px}
  #gate input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,103,42,.14)}
  #gate .hint{font-size:12px;color:var(--muted);margin:-8px 0 14px;text-align:left;line-height:1.6}
  #gate button{width:100%;padding:12px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);
    color:#fff;font-size:15px;font-weight:500;cursor:pointer;font-family:var(--sans)}
  #gate button:disabled{opacity:.55;cursor:default}
  #gate .err{color:#b3402f;font-size:13.5px;min-height:20px;margin:10px 0 0}
  #gate .meta{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.8}
  .privlink{display:inline-block;font-size:13px;color:var(--accent);text-decoration:none;
    border:1px solid rgba(168,103,42,.45);border-radius:999px;padding:4px 14px}
  .privlink:hover{background:rgba(168,103,42,.12)}

  /* ---------- 已在放映時的狀態 ---------- */
  #topbar{position:fixed;top:0;right:0;left:0;height:44px;display:none;align-items:center;gap:12px;z-index:6;
    padding:0 16px;background:rgba(241,236,227,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  #topbar.on{display:flex}
  #topbar .who{font-size:12.5px;color:var(--accent);border:1px solid rgba(168,103,42,.45);border-radius:999px;padding:2px 11px}
  #topbar .sp{margin-left:auto}
  #topbar button{all:unset;cursor:pointer;font-size:12.5px;color:var(--muted);padding:4px 10px;border-radius:8px}
  #topbar button:hover{background:rgba(60,45,25,.07);color:var(--ink)}
  #guard{position:fixed;inset:0;background:rgba(233,227,215,.985);z-index:90;display:none;align-items:center;
    justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:30px}
  #guard.on{display:flex}
  #guard .i{font-size:32px}
  #guard p{margin:0;color:var(--soft);font-size:15px}
  #guard small{color:var(--muted);font-size:12.5px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(30,28,24,.93);
    color:#f0e9dc;border-radius:999px;padding:8px 18px;font-size:13px;z-index:96;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.on{opacity:1}
</style>

<script>
'use strict';
/* ============ 基礎防護 ============ */
const toastEl=document.getElementById('toast');let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2200)}
document.addEventListener('contextmenu',e=>e.preventDefault(),true);
document.addEventListener('dragstart',e=>e.preventDefault(),true);
document.addEventListener('selectstart',e=>e.preventDefault(),true);
['copy','cut'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),true));
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&['s','p','u','i','j','c'].includes(k)){e.preventDefault();toast('此內容受保護，該操作已禁用');return}
  if(e.key==='PrintScreen'){e.preventDefault();toast('已禁用截圖快捷鍵');return}
  if(e.key==='F12'||e.key==='ContextMenu'){e.preventDefault()}
},{capture:true});
window.addEventListener('beforeprint',()=>{const v=document.getElementById('lbv');if(v)v.style.visibility='hidden'});

/* ============ 狀態 ============ */
let key=null,who='',META=null,ready=false;
const WHO_KEY='qr_who_video';
// 與另一頁分開存儲，避免互相污染；並清理早期測試殘留的舊鍵
try{localStorage.removeItem('qr_who')}catch(e){}
const lb=document.getElementById('lb'),v=document.getElementById('lbv'),t=document.getElementById('lbt');
const gate=document.getElementById('gate');

/* ============ Web Crypto ============ */
function b64ToBuf(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function deriveKey(pw,saltB64,iter){
  const salt=b64ToBuf(saltB64);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function decryptBlob(key,buf){
  const u=new Uint8Array(buf);
  if(String.fromCharCode(...u.slice(0,4))!=='SLD1') throw new Error('bad magic');
  const iv=u.slice(4,16),tag=u.slice(16,32),ct=u.slice(32);
  const payload=new Uint8Array(ct.length+16);payload.set(ct,0);payload.set(tag,ct.length);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,tagLength:128},key,payload);
  return plain;
}

/* ============ 浮水印 ============ */
function wmLabel(){ return who?`錢老師 · ${who} · 受保護放映 · 請勿截圖`:'錢老師 · 受保護放映 · 請勿截圖'; }
function fillWatermarks(){
  const label=wmLabel();
  // 影片播放層
  const wm=document.getElementById('wm');wm.innerHTML='';
  for(let i=0;i<7;i++){
    const s=document.createElement('span');s.textContent=label;
    s.style.left=(-14+(i%3)*38)+'%';s.style.top=(-4+Math.floor(i/3)*46+i*3)+'%';
    wm.appendChild(s);
  }
  // 整頁層（lightbox 開啟時隱藏，避免透出干擾影片）
  const pg=document.getElementById('pgwm');pg.innerHTML='';
  for(let i=0;i<14;i++){
    const s=document.createElement('span');s.textContent=label;
    s.style.left=(-16+(i%4)*30)+'%';s.style.top=(-6+Math.floor(i/4)*30+i*2)+'%';
    pg.appendChild(s);
  }
  document.getElementById('whoTag').textContent=who||'未標識';
  document.getElementById('lbtWho').textContent=who||'未標識';
}

/* ============ 載入封面 ============ */
async function loadThumbs(){
  for(const c of document.querySelectorAll('.card')){
    const img=c.querySelector('img');
    const name=c.dataset.src.replace('.mp4','.jpg.enc');
    try{
      const res=await fetch('videos-enc/'+name,{cache:'no-store'});
      const plain=await decryptBlob(key,await res.arrayBuffer());
      img.src=URL.createObjectURL(new Blob([plain],{type:'image/jpeg'}));
    }catch(e){ /* 封面失敗不影響主流程 */ }
  }
}

/* ============ 播放影片 ============ */
let currentUrl=null;
async function play(card){
  const name=card.dataset.src;
  t.textContent=card.dataset.title;
  document.getElementById('lbtWho').textContent=who||'未標識';
  lb.hidden=false;
  document.getElementById('pgwm').style.display='none';
  toast('正在解密影片…');
  try{
    if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}
    const res=await fetch('videos-enc/'+name+'.enc',{cache:'no-store'});
    if(!res.ok) throw new Error('http '+res.status);
    const plain=await decryptBlob(key,await res.arrayBuffer());
    currentUrl=URL.createObjectURL(new Blob([plain],{type:'video/mp4'}));
    v.src=currentUrl;
    toastEl.classList.remove('on');   // 解密完成，撤掉提示
    await v.play().catch(()=>{});
  }catch(e){
    toast('影片解密失敗：'+e.message);
  }
}
function closeLb(){
  if(document.fullscreenElement)document.exitFullscreen();
  v.pause();v.removeAttribute('src');v.load();
  if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}
  lb.hidden=true;
  document.getElementById('pgwm').style.display='';
}
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{if(ready)play(c)}));
document.querySelector('.close').onclick=closeLb;
lb.addEventListener('click',e=>{if(e.target===lb)closeLb()});
document.addEventListener('keydown',e=>{
  if(!lb.hidden&&e.key==='Escape'&&!document.fullscreenElement)closeLb();
});

/* ============ 失焦護盾 ============ */
const guard=document.getElementById('guard');let guardOn=false;
function setGuard(on){
  if(on===guardOn)return;guardOn=on;guard.classList.toggle('on',on);
  if(on){v.pause()}
  else if(!lb.hidden&&v.src)v.play().catch(()=>{});
}
window.addEventListener('blur',()=>setGuard(true));
window.addEventListener('focus',()=>setGuard(false));
document.addEventListener('visibilitychange',()=>setGuard(document.hidden));
guard.addEventListener('click',()=>setGuard(false));

/* ============ 進入流程 ============ */
const whoEl=document.getElementById('who'),pwdEl=document.getElementById('pwd');
const goEl=document.getElementById('go'),errEl=document.getElementById('err');
// 記住上次填寫的姓名
whoEl.value=localStorage.getItem(WHO_KEY)||'';

async function enter(){
  const pw=pwdEl.value.trim();
  if(!pw){errEl.textContent='請輸入密碼';return}
  goEl.disabled=true;errEl.textContent='';
  try{
    const res=await fetch('manifest-videos.json',{cache:'no-store'});
    META=await res.json();
    const k=await deriveKey(pw,META.salt,META.iter);
    // 用第一支影片的封面驗證密碼
    const vr=await fetch('videos-enc/'+META.files[0],{cache:'no-store'});
    await decryptBlob(k,await vr.arrayBuffer());
    key=k;
    who=whoEl.value.trim();
    localStorage.setItem(WHO_KEY,who);
    fillWatermarks();
    gate.classList.add('off');
    document.body.classList.remove('locked');
    document.getElementById('topbar').classList.add('on');
    ready=true;
    loadThumbs();
  }catch(e){
    errEl.textContent='密碼不正確，請重試';
    pwdEl.select();
  }finally{goEl.disabled=false}
}
goEl.onclick=enter;
pwdEl.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
whoEl.focus();

document.getElementById('editWho').onclick=()=>{
  const n=prompt('請輸入你的姓名或郵箱（會嵌入浮水印）。\n若要清除，請直接按確定鍵並留空。',who);
  if(n!==null){
    who=n.trim();
    if(who) localStorage.setItem(WHO_KEY,who); else localStorage.removeItem(WHO_KEY);
    fillWatermarks();
  }
};
document.getElementById('clearWho').onclick=()=>{
  who='';
  localStorage.removeItem(WHO_KEY);
  fillWatermarks();
};
document.getElementById('lock').onclick=()=>{
  ready=false;closeLb();gate.classList.remove('off');
  document.body.classList.add('locked');
  document.getElementById('topbar').classList.remove('on');
  document.getElementById('pgwm').innerHTML='';
  document.getElementById('wm').innerHTML='';
  pwdEl.value='';pwdEl.focus();
};
</script>
