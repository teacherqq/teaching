<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>學習數據看板示範</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=LXGW+WenKai+TC:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: instrument console — sticky control bar, then summary strip, then charts and tables on a 12-col grid that collapses to one column */
:root{
  --bg:#f3f6f8; --panel:#ffffff; --panel-2:#f7fafb; --line:#e3e9ee; --line-2:#cdd7df;
  --fg:#16212b; --muted:#5d6e7d; --faint:#8696a4;
  --accent:#0b8f9a; --accent-dim:rgba(11,143,154,.10); --glow:rgba(11,143,154,.28);
  --bar:rgba(243,246,248,.92); --tip:rgba(255,255,255,.98); --scrim:rgba(22,33,43,.38); --shadow:0 1px 2px rgba(22,33,43,.04),0 4px 14px rgba(22,33,43,.05);
  --read:#2f6fd6; --write:#c97a12; --listen:#16936a; --oral:#8355d4;
  --red:#d93a3a; --orange:#d9700b; --yellow:#a87d00; --on-accent:#ffffff;
  --f-display:"Oxanium","LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","KaiTi","DFKai-SB",serif;
  --f-body:"IBM Plex Sans","LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","KaiTi","DFKai-SB",serif;
  --f-mono:"JetBrains Mono","LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","KaiTi","DFKai-SB",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(circle at 1px 1px,rgba(22,60,90,.07) 1px,transparent 0);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:none;margin:0 auto;padding-left:max(clamp(16px,2.5vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.5vw,48px),env(safe-area-inset-right,0px))}
@media (min-width:1100px){body{zoom:1.12}}
@media (min-width:1280px){body{zoom:1.22}}
@media (min-width:1500px){body{zoom:1.32}}
@media (min-width:1800px){body{zoom:1.45}}
@media (min-width:2300px){body{zoom:1.7}}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.bar-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0;flex-wrap:wrap}
.demo-tag{font-size:12px;color:var(--orange);border:1px solid var(--orange);border-radius:999px;padding:1px 9px;white-space:nowrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;margin:0;white-space:nowrap}
.brand .sub{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--panel);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent);background:var(--panel-2)}
.btn.primary{border-color:var(--accent);color:var(--accent)}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.switcher{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:4px 12px;font-family:var(--f-body);font-size:14px;cursor:pointer;position:relative;color:var(--muted)}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent);box-shadow:0 2px 10px var(--glow)}
.chip.t-red{color:var(--red);border:2px solid var(--red);font-weight:700}
.chip.t-orange{color:var(--orange);border-color:var(--orange)}
.chip.t-green{color:var(--listen);border-color:var(--listen)}
.chip.on.t-red{background:var(--red);color:#fff;box-shadow:0 2px 10px rgba(217,58,58,.3)}
.chip.on.t-orange{background:var(--orange);color:#fff;box-shadow:0 2px 10px rgba(217,112,11,.3)}
.chip.on.t-green{background:var(--listen);color:#fff;box-shadow:0 2px 10px rgba(22,147,106,.3)}
.nm.t-red{color:var(--red)}.nm.t-orange{color:var(--orange)}.nm.t-green{color:var(--listen)}
.tlegend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
body.solo .tlegend{display:none}
.chip .dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;border:2px solid var(--panel)}
.solo-banner{display:none;align-items:center;gap:10px;color:var(--muted);font-size:13px}
body.solo .switcher,body.solo .teacher-only{display:none!important}
body.solo .solo-banner{display:flex}
body.solo .flag,body.solo .flags{display:none!important}
body.solo .sc .d.vs{display:none!important}

main{overflow-x:clip;padding-block:22px 60px;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:16px 18px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 .zh{letter-spacing:.04em;text-transform:none;color:var(--fg);font-size:15.5px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-3{grid-column:span 3}
@media (max-width:900px){.span-8,.span-7,.span-5,.span-4,.span-6{grid-column:span 12}.span-3{grid-column:span 6}}
@media (max-width:480px){.span-3{grid-column:span 12}}

.kpi .label{color:var(--muted);font-size:13px;letter-spacing:.04em}
.kpi .value{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .value small{font-size:14px;color:var(--muted);font-weight:400;margin-left:4px}
.kpi .hint{color:var(--faint);font-size:13px;margin-top:2px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend .lg{all:unset;cursor:pointer;display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;border:1px solid var(--line);transition:opacity .15s,background .15s}
.legend .lg:hover{background:var(--accent-dim)}
.legend .lg.off{opacity:.38;text-decoration:line-through}
.legend .lg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sc[data-sk]{cursor:pointer;transition:opacity .15s,border-color .15s}
.sc[data-sk]:hover{border-color:var(--accent)}
.sc.off{opacity:.42}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)!important}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--tip);box-shadow:var(--shadow);border:1px solid var(--line-2);border-radius:6px;padding:7px 10px;font-size:13px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;z-index:2}
.chart .tip b{font-family:var(--f-display);font-weight:600;display:block;margin-bottom:2px}
.chart .tip .r{display:flex;gap:8px;align-items:center}
.chart .tip .r i{width:8px;height:8px;border-radius:50%}
.pt{filter:drop-shadow(0 0 3px currentColor);stroke:var(--panel);stroke-width:1.5}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:13px;letter-spacing:.03em}
td.c,th.c{text-align:center}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
.heat{border-radius:4px;padding:3px 6px;display:inline-block;min-width:54px;text-align:center}
.heat small{opacity:.7;margin-left:4px}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:13px;border-radius:999px;padding:2px 9px;border:1px solid currentColor;white-space:nowrap}
.flag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.flag.red{color:var(--red)}.flag.orange{color:var(--orange)}.flag.yellow{color:var(--yellow)}.flag.grey{color:var(--muted)}.flag.ok{color:var(--listen)}
.flags{display:flex;gap:6px;flex-wrap:wrap}

.hero{display:flex;gap:22px;align-items:stretch;flex-wrap:wrap}
.hero .code{font-family:var(--f-display);font-size:48px;font-weight:700;letter-spacing:.02em;line-height:1;color:var(--accent)}
.gauge{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.gauge .g{display:flex;flex-direction:column}
.gauge .g span{color:var(--muted);font-size:13px}
.gauge .g strong{font-family:var(--f-display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.gapline{font-size:14px;color:var(--muted);max-width:46ch}
.skillcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.skillcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel-2);min-width:0}
.sc .n{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;white-space:nowrap}
.sc .n i{width:8px;height:8px;border-radius:50%;flex:none}
.sc .v{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.sc .d{font-size:13px}
.s25{color:var(--accent);white-space:nowrap}
.up{color:var(--listen)}.down{color:var(--red)}.flat{color:var(--muted)}

.fb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.fb{grid-template-columns:1fr}}
.fb section{border-top:2px solid var(--line-2);padding-top:10px;min-width:0}
.fb section.s{border-color:var(--listen)}.fb section.i{border-color:var(--orange)}.fb section.n{border-color:var(--accent)}
.fb h3{margin:0 0 6px;font-size:13px;font-family:var(--f-display);letter-spacing:.06em}
.fb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.fb li .en{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
textarea,input[type=text],input[type=number],input[type=date],select{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:84px;resize:vertical;line-height:1.5}
.savestate{font-size:13px;color:var(--faint)}
.dropalert{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 7%,var(--panel,#fff));border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.dropalert .ic{font-size:28px;line-height:1;color:var(--red)}
.dropalert b.big{display:block;color:var(--red);font-size:22px;line-height:1.35}
.dropalert .det{color:var(--red);font-size:16px;margin-top:4px}
.dropalert .oth{color:var(--muted);font-size:14px;margin-top:4px}
body.solo .dropalert{display:none!important}
.mic{display:inline-flex;align-items:center;gap:6px}
.mic.on{background:var(--red);color:#fff;border-color:var(--red);animation:micp 1.2s ease-in-out infinite}
@keyframes micp{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 25%,transparent)}}
.interim{color:var(--faint);font-size:14px;min-height:1.4em;margin-top:6px}
.miclang{width:auto;font-size:13px;padding:2px 6px}
.comment{background:var(--panel-2);border:1px dashed var(--line-2);border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:14.5px;max-width:90ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.note-s{font-size:13px;color:var(--faint)}

.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--f-display);color:var(--fg);font-size:18px;margin-bottom:6px}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 20px max(12px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;width:min(980px,100%);padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.modal h3{margin:0;font-family:var(--f-display);font-size:17px;letter-spacing:.04em}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.entry td{padding:4px 5px}
.entry input{width:74px;padding:5px 6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--accent);color:var(--fg);padding:9px 16px;border-radius:8px;z-index:30;font-size:13px}
.err{color:var(--red);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="bar">
  <div class="wrap">
    <div class="bar-row">
      <div class="brand"><h1>示範班級</h1><span class="sub">學習數據看板</span><span class="demo-tag">示範數據 · 姓名與分數均為虛構</span></div>
      <div class="row teacher-only">
        <button class="btn" id="btnAdd">＋ 新增評估</button>
        <button class="btn" id="btnImport">導入表格</button>
        <input type="file" id="fileImport" accept=".xlsx,.xls,.csv" hidden>
      </div>
      <button class="btn ghost" id="btnSolo" aria-pressed="false" title="面談時只顯示當前學生">單人模式</button>
      <button class="btn ghost" id="btnLang" title="切換成英文">EN</button>
      <button class="btn ghost" id="btnSound" aria-pressed="true" title="齒輪音效">♪ 音效開</button>
      <button class="btn ghost" id="btnFull" aria-pressed="false" title="全螢幕顯示" hidden>⛶ 全螢幕</button>
    </div>
    <nav class="switcher" id="switcher" aria-label="切換學生"></nav>
    <div class="tlegend teacher-only" id="tlegend"></div>
    <div class="solo-banner"><span>單人模式：只顯示這位同學的數據</span><button class="btn ghost" id="btnSoloExit">退出</button></div>
  </div>
</header>

<main class="wrap" id="app">
  <div class="empty"><strong>正在載入成績數據…</strong>數據保存在這個頁面的數據庫裏。如果還是空的，可以點「＋ 新增評估」或「導入表格」加入第一份成績。</div>
</main>

<div id="modalRoot"></div>

<script>
(() => {
"use strict";
const SK = ["reading","writing","listening","oral"];
const SKN = {reading:"閱讀",writing:"寫作",listening:"聽力",oral:"口語"};
const SKE = {reading:"Reading",writing:"Writing",listening:"Listening",oral:"Speaking"};
const SKC = {reading:"var(--read)",writing:"var(--write)",listening:"var(--listen)",oral:"var(--oral)"};
const TYPES = ["單元測","作業","口語考","EOY","Mock","其他"];
const S = {skOff:new Set(), db:null, assessments:[], scores:{}, students:{}, view:"class", solo:false, ready:{a:false,s:false,st:false}};
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
let LANG=store.get("y13.lang","zh");
S.skOff=new Set(store.get("y13.skoff",[]));
const skOn = ser => { const f=ser.filter(x=>!x.k||!S.skOff.has(x.k)); return f.length?f:ser; };
const T=(zh,en)=>LANG==="en"?en:zh;
const SKL=k=>k?T(SKN[k],SKE[k]):"";
const TYPEE={"單元測":"Unit test","作業":"Homework","口語考":"Oral exam","EOY":"EOY","Mock":"Mock","其他":"Other"};
const TY=t=>LANG==="en"?(TYPEE[t]||t):t;
const FL=f=>T(f.zh,f.en);
const toast = (msg,ms=2400) => { const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); };

/* ---------- gear sound ---------- */
let actx=null, soundOn=store.get("y13.sound",true), lastTick=0;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } if(actx&&actx.state==="suspended") actx.resume().catch(()=>{}); }
function tick(vol=1){
  if(!soundOn||!actx||actx.state!=="running") return;
  const now=performance.now(); if(now-lastTick<38) return; lastTick=now;
  const t=actx.currentTime, len=Math.floor(actx.sampleRate*0.028);
  const buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const src=actx.createBufferSource(); src.buffer=buf;
  const bp=actx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2600+Math.random()*900; bp.Q.value=9;
  const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22*vol,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.03);
  const o=actx.createOscillator(); o.type="square"; o.frequency.setValueAtTime(1500,t); o.frequency.exponentialRampToValueAtTime(700,t+0.012);
  const og=actx.createGain(); og.gain.setValueAtTime(0.03*vol,t); og.gain.exponentialRampToValueAtTime(0.0001,t+0.015);
  src.connect(bp).connect(g).connect(actx.destination); o.connect(og).connect(actx.destination);
  src.start(t); o.start(t); o.stop(t+0.02);
}
function ratchet(){ if(!soundOn) return; [0,45,90].forEach((ms,i)=>setTimeout(()=>{lastTick=0;tick(1-i*0.2)},ms)); }
document.addEventListener("pointerdown",ensureAudio,{passive:true});
document.addEventListener("keydown",ensureAudio);

/* ---------- grade helpers ---------- */
function gnum(g){
  if(g===null||g===undefined||g==="") return null;
  const s=String(g).trim();
  if(s.includes("/")){ const p=s.split("/").map(gnum).filter(x=>x!==null); return p.length?p.reduce((a,b)=>a+b,0)/p.length:null; }
  const m=s.match(/^(\d+(?:\.\d+)?)([+-]?)$/); if(!m) return null;
  return +m[1]+(m[2]==="+"?0.3:m[2]==="-"?-0.3:0);
}
const singleSkill = a => { const r=Object.values(S.scores).find(v=>v.aid===a.id&&v.skills&&Object.keys(v.skills).length); return r?Object.keys(r.skills)[0]:null; };
const pt25 = p => p==null||isNaN(p) ? "—" : (Math.round(p/4*10)/10).toString();
const fmtPct = p => p===null||p===undefined||isNaN(p) ? "—" : (Math.round(p*10)/10).toString();
const mean = a => { const v=a.filter(x=>x!==null&&x!==undefined&&!isNaN(x)); return v.length?v.reduce((s,x)=>s+x,0)/v.length:null; };

/* ---------- derived data ---------- */
const codes = () => Object.keys(S.students).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
const assessOrdered = () => S.assessments.slice().sort((a,b)=>(a.order??0)-(b.order??0));
const nm = sid => (S.students[sid]?.label||"").trim() || sid;
const isSingle = a => { if(!a) return false; if(a.single===true) return true; if(a.single===false) return false; const rs=Object.values(S.scores).filter(v=>v.aid===a.id); return rs.length>0 && rs.every(v=>Object.keys(v.skills||{}).length<=1); };
const fullAs = () => assessOrdered().filter(a=>!isSingle(a));
const sc = (aid,sid) => S.scores[aid+"__"+sid] || null;
function classAvg(aid, skill){ return mean(codes().map(c=>{const r=sc(aid,c); return r? (skill? r.skills?.[skill]?.pct : r.pct) : null;})); }
function studentSeries(sid){ return assessOrdered().map(a=>({a, r:sc(a.id,sid)})); }
function analyse(sid){
  const st=S.students[sid]||{}; const target=gnum(st.target)??7;
  const ser=studentSeries(sid).filter(x=>x.r);
  const flags=[];
  const graded=ser.filter(x=>!isSingle(x.a)&&gnum(x.r.grade)!==null);
  const latest=graded[graded.length-1]||null;
  const cur=latest?gnum(latest.r.grade):null;
  if(cur!==null && cur < target-0.35) flags.push({k:"red",zh:"低於目標",en:"Below target",t:T(`${latest.a.name} 等級 ${latest.r.grade}，目標 ${st.target||7}`,`${latest.a.name} grade ${latest.r.grade}, target ${st.target||7}`)});
  const ov=ser.filter(x=>!isSingle(x.a)&&x.r.pct!==null&&x.r.pct!==undefined&&x.a.type!=="作業");
  if(ov.length>=2){
    const p=ov.map(x=>x.r.pct); const n=p.length;
    const d1=p[n-1]-p[n-2], d2=n>=3?p[n-2]-p[n-3]:null;
    if(d1<=-8 || (d2!==null && d1<0 && d2<0 && (p[n-1]-p[n-3])<=-5))
      flags.push({k:"orange",zh:"最近在退步",en:"Recent decline",t:`${ov[n-2].a.name} ${fmtPct(p[n-2])}% → ${ov[n-1].a.name} ${fmtPct(p[n-1])}%`});
  }
  const sk={};
  SK.forEach(k=>{ const pts=ser.map(x=>x.r.skills?.[k]).filter(Boolean); sk[k]={pct:mean(pts.map(p=>p.pct)), g:mean(pts.map(p=>gnum(p.grade))), n:pts.length, series:studentSeries(sid).map(x=>x.r?.skills?.[k]?.pct??null)}; });
  const have=SK.filter(k=>sk[k].n>0);
  let weakest=null, strongest=null;
  if(have.length>=2){
    weakest=have.reduce((a,b)=>sk[a].pct<=sk[b].pct?a:b); strongest=have.reduce((a,b)=>sk[a].pct>=sk[b].pct?a:b);
    const others=have.filter(k=>k!==weakest);
    const gapP=mean(others.map(k=>sk[k].pct))-sk[weakest].pct;
    const og=mean(others.map(k=>sk[k].g)), wg=sk[weakest].g;
    if((og!==null&&wg!==null&&og-wg>=0.8) || gapP>=10)
      flags.push({k:"yellow",zh:`${SKN[weakest]}是短板`,en:`${SKE[weakest]} lags`,t:T(`${SKN[weakest]}平均 ${pt25(sk[weakest].pct)}/25，其他技能平均 ${pt25(mean(others.map(k=>sk[k].pct)))}/25`,`${SKE[weakest]} avg ${pt25(sk[weakest].pct)}/25; other skills avg ${pt25(mean(others.map(k=>sk[k].pct)))}/25`)});
  }
  const missing=[];
  assessOrdered().forEach(a=>{
    const r=sc(a.id,sid);
    const classHas=SK.filter(k=>codes().some(c=>sc(a.id,c)?.skills?.[k]));
    if(!r){ if(codes().some(c=>sc(a.id,c))) missing.push(T(`${a.name}（整份）`,`${a.name} (all)`)); return; }
    classHas.forEach(k=>{ if(!r.skills?.[k]) missing.push(`${a.name} ${SKL(k)}`); });
  });
  return {sid,target,targetLabel:st.target||"7",latest,cur,flags,sk,weakest,strongest,missing,ser};
}

function trend(sid){
  const ov=studentSeries(sid).filter(x=>x.r&&!isSingle(x.a)&&x.r.pct!=null&&x.a.type!=="作業");
  if(ov.length<2) return null;
  const a=ov[ov.length-2], b=ov[ov.length-1], d=b.r.pct-a.r.pct;
  const k=d<-3?"red":d<0?"orange":"green";
  const t=`${a.a.name} ${fmtPct(a.r.pct)} → ${b.a.name} ${fmtPct(b.r.pct)}（${d>=0?"+":""}${fmtPct(d)}）`;
  return {k,d,t};
}
function skillDrop(sid){
  const tr=trend(sid); if(!tr||tr.k!=="red") return null;
  const ov=studentSeries(sid).filter(x=>x.r&&!isSingle(x.a)&&x.r.pct!=null&&x.a.type!=="作業");
  const a=ov[ov.length-2], b=ov[ov.length-1];
  const ds=SK.map(k=>{ const p=a.r.skills?.[k]?.pct, q=b.r.skills?.[k]?.pct; return (p==null||q==null)?null:{k,p,q,d:q-p}; }).filter(x=>x&&x.d<0).sort((x,y)=>x.d-y.d);
  if(!ds.length) return null;
  return {a:a.a.name,b:b.a.name,top:ds[0],rest:ds.slice(1),tr};
}
function dropAlertHTML(sid){
  const x=skillDrop(sid); if(!x||S.solo) return "";
  const t=x.top, n=pt25(-t.d);
  return `<div class="panel dropalert" role="alert"><span class="ic">⚠</span><div><b class="big">${T(`${SKN[t.k]}掉得最多，需要特別注意`,`${SKE[t.k]} dropped the most — needs special attention`)}</b>
  <div class="det">${SKL(t.k)}：${esc(x.a)} ${pt25(t.p)}/25 → ${esc(x.b)} ${pt25(t.q)}/25（${T("下降","down")} ${n} ${T("分","pts")}）</div>
  ${x.rest.length?`<div class="oth">${T("其他下降：","Also down: ")}${x.rest.map(r=>`${SKL(r.k)} −${pt25(-r.d)}`).join(T("、",", "))}</div>`:""}</div></div>`;
}
/* ---------- feedback text ---------- */
const ACTIONS = {
  reading:[["每週做兩篇不同文本類型的 Paper 2 閱讀，先圈題目關鍵詞，再回原文定位。","Do two Paper 2 reading texts of different text types each week; underline key words in the question, then locate them in the text."],["判斷正誤題一定寫出原文依據，練習用自己的話概括段落大意。","For true/false items, always quote the evidence; practise summarising each paragraph in your own words."]],
  writing:[["每週一篇限時 Paper 1 寫作（SL 250–400 字），輪換電郵、博客、演講稿、報告等文本類型。","Write one timed Paper 1 task a week (SL 250–400 characters), rotating email, blog, speech and report formats."],["寫完先自查三項：文本格式、語域是否配合讀者、段落之間的連接詞。","Self-check three things after writing: text-type conventions, register for the audience, and linking words between paragraphs."]],
  listening:[["每週聽兩段不同語速的材料，聽前先讀題預測內容，邊聽邊記數字、人名和關鍵詞。","Listen to two recordings at different speeds each week; predict from the questions first, then note numbers, names and key words."],["做完對照聽力稿，把沒聽出來的詞句整理成生詞本。","After each task, check the transcript and log the words you missed."]],
  oral:[["個人口語按「描述圖片 → 連結主題 → 表達看法 → 聯繫文化」的結構練習，每次錄音自評。","Practise the individual oral as describe → link to theme → give opinion → connect to culture; record and review each attempt."],["回答追問時多用「因為…所以…」「舉個例子…」把回答延伸到三四句。","Extend follow-up answers to three or four sentences with reasons and examples."]]
};
function feedback(sid){
  const A=analyse(sid); const out={s:[],i:[],n:[]};
  const best=A.strongest, weak=A.weakest;
  const sevens=SK.filter(k=>A.sk[k].n>0&&A.sk[k].g!==null&&A.sk[k].g>=6.85);
  if(best) out.s.push([`${SKN[best]}是最強項，平均 ${pt25(A.sk[best].pct)}/25。`,`${SKE[best]} is the strongest skill, averaging ${pt25(A.sk[best].pct)}/25.`]);
  if(sevens.length) out.s.push([`${sevens.map(k=>SKN[k]).join("、")}一直保持在 7 分水平。`,`${sevens.map(k=>SKE[k]).join(", ")} consistently at grade 7.`]);
  const ov=A.ser.filter(x=>!isSingle(x.a)&&x.r.pct!=null&&x.a.type!=="作業");
  if(ov.length>=2){
    const f=ov[0], l=ov[ov.length-1], d=l.r.pct-f.r.pct;
    if(d>=3) out.s.push([`總分從 ${f.a.name} 的 ${fmtPct(f.r.pct)}% 提升到 ${l.a.name} 的 ${fmtPct(l.r.pct)}%。`,`Overall score rose from ${fmtPct(f.r.pct)}% (${f.a.name}) to ${fmtPct(l.r.pct)}% (${l.a.name}).`]);
    else if(d<=-3) out.i.push([`總分從 ${f.a.name} 的 ${fmtPct(f.r.pct)}% 降到 ${l.a.name} 的 ${fmtPct(l.r.pct)}%，需要找出原因。`,`Overall score fell from ${fmtPct(f.r.pct)}% (${f.a.name}) to ${fmtPct(l.r.pct)}% (${l.a.name}); worth finding out why.`]);
    else out.s.push([`總分保持穩定，在 ${fmtPct(Math.min(...ov.map(x=>x.r.pct)))}–${fmtPct(Math.max(...ov.map(x=>x.r.pct)))}% 之間。`,`Overall performance is steady, between ${fmtPct(Math.min(...ov.map(x=>x.r.pct)))}% and ${fmtPct(Math.max(...ov.map(x=>x.r.pct)))}%.`]);
  }
  if(weak && weak!==best) out.i.push([`${SKN[weak]}是相對短板，平均 ${pt25(A.sk[weak].pct)}/25，比最強項低 ${pt25(A.sk[best].pct-A.sk[weak].pct)} 分。`,`${SKE[weak]} is the relative weak spot at ${pt25(A.sk[weak].pct)}/25, ${pt25(A.sk[best].pct-A.sk[weak].pct)} marks below the strongest skill.`]);
  A.flags.forEach(f=>{ if(f.k==="red") out.i.push([`最近等級 ${A.latest.r.grade}，距離目標 ${A.targetLabel} 還差一點。`,`Latest grade ${A.latest.r.grade}, just short of the target of ${A.targetLabel}.`]); if(f.k==="orange") out.i.push([`最近兩次評估有下滑：${f.t}。`,`Recent dip: ${f.t}.`]); });
  if(!out.i.length) out.i.push(["各項都在高水平，下一步是把 7 分穩定在考試狀態。","All skills are strong; the next step is holding grade 7 under exam conditions."]);
  const focus=weak?[weak]:[]; if(A.sk.oral.n>0 && weak!=="oral" && A.sk.oral.g!==null && A.sk.oral.g<6.85) focus.push("oral");
  focus.forEach(k=>ACTIONS[k].forEach(a=>out.n.push(a)));
  if(!out.n.length) out.n.push(["保持每週一篇限時寫作和一套閱讀，備考 Mock。","Keep one timed writing task and one reading paper a week ahead of the Mock."]);
  return {A,out};
}
function combined(sid){
  const {A,out}=feedback(sid); const note=(S.students[sid]?.note||"").trim();
  const zh=[`${nm(sid)} 本階段表現：`+out.s.map(x=>x[0]).join("")+out.i.map(x=>x[0]).join(""), "建議："+out.n.slice(0,2).map(x=>x[0]).join(""), note?`老師觀察：${note}`:""].filter(Boolean).join("\n");
  const en=[`${nm(sid)} this term: `+out.s.map(x=>x[1]).join(" ")+" "+out.i.map(x=>x[1]).join(" "), "Next steps: "+out.n.slice(0,2).map(x=>x[1]).join(" "), note?`Teacher's observation: ${note}`:""].filter(Boolean).join("\n");
  return LANG==="en"? en+"\n\n"+zh : zh+"\n\n"+en;

/* ---------- SVG line chart ---------- */
function lineChart(host, {labels, series, yMin=50, yMax=100, h=240, unit="%"}){
  const W=Math.max(300,Math.round(host.clientWidth||760)), H=W<520?Math.round(h*0.85):Math.round(h*Math.min(1.35,Math.max(1,W/900))), L=40, R=16, T=14, B=34;
  const x=i=> labels.length<=1 ? L+(W-L-R)/2 : L+(W-L-R)*i/(labels.length-1);
  const y=v=> T+(H-T-B)*(1-(v-yMin)/(yMax-yMin));
  const ticks=[]; for(let v=yMin; v<=yMax+1e-9; v+=(yMax-yMin)/5) ticks.push(Math.round(v));
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.name).join("、"))} 趨勢">`;
  ticks.forEach(v=>{ svg+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" fill="var(--faint)" font-size="12.5" text-anchor="end" font-family="JetBrains Mono, monospace">${v}</text>`; });
  labels.forEach((lb,i)=>{ svg+=`<text x="${x(i)}" y="${H-10}" fill="var(--muted)" font-size="13" text-anchor="middle">${esc(lb)}</text>`; });
  series.forEach(s=>{
    let d="", area="", started=false, first=null, last=null;
    s.values.forEach((v,i)=>{ if(v===null||v===undefined) return; const px=x(i), py=y(Math.max(yMin,Math.min(yMax,v))); d+=(started?"L":"M")+px.toFixed(1)+","+py.toFixed(1); if(!started) first=[px,py]; last=[px,py]; started=true; });
    if(!started) return;
    if(s.fill){ area=d+`L${last[0].toFixed(1)},${y(yMin)}L${first[0].toFixed(1)},${y(yMin)}Z`; svg+=`<path d="${area}" fill="${s.color}" fill-opacity=".08" stroke="none"/>`; }
    svg+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?1.5:2.2}" ${s.dash?'stroke-dasharray="5 4" stroke-opacity=".7"':""} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(!s.dash) s.values.forEach((v,i)=>{ if(v===null||v===undefined) return; const isLast=i===s.values.map((q,j)=>q==null?-1:j).reduce((a,b)=>Math.max(a,b)); svg+=`<circle class="pt" cx="${x(i)}" cy="${y(Math.max(yMin,Math.min(yMax,v)))}" r="${isLast?4.5:3}" fill="${s.color}" style="color:${s.color}"/>`; });
  });
  svg+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--accent)" stroke-opacity="0" stroke-width="1"/>`;
  svg+=`<rect class="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg><div class="tip"></div>`;
  host.classList.add("chart"); host.innerHTML=svg;
  const el=host.querySelector("svg"), xh=host.querySelector(".xh"), tip=host.querySelector(".tip"); let cur=-1;
  function at(evt){
    const r=el.getBoundingClientRect(); const sx=(evt.clientX-r.left)*W/r.width;
    let best=0,bd=1e9; labels.forEach((_,i)=>{const dd=Math.abs(x(i)-sx); if(dd<bd){bd=dd;best=i;}});
    if(best!==cur){ cur=best; tick(0.8); }
    xh.setAttribute("x1",x(best)); xh.setAttribute("x2",x(best)); xh.setAttribute("stroke-opacity",".5");
    const rows=series.filter(s=>s.values[best]!=null).map(s=>`<div class="r"><i style="background:${s.color}"></i>${esc(s.name)}<span class="num" style="margin-left:auto">${fmtPct(s.values[best])}${unit}</span></div>`).join("");
    tip.innerHTML=`<b>${esc(labels[best])}</b>${rows||`<span class="muted">${T("沒有數據","No data")}</span>`}`;
    const vals=series.map(s=>s.values[best]).filter(v=>v!=null); const topV=vals.length?Math.max(...vals):yMax;
    tip.style.left=(x(best)/W*r.width)+"px"; tip.style.top=(y(Math.min(yMax,topV))/H*r.height)+"px"; tip.style.opacity=1;
  }
  const hit=host.querySelector(".hit");
  hit.addEventListener("pointermove",at); hit.addEventListener("pointerdown",at);
  hit.addEventListener("pointerleave",()=>{cur=-1; tip.style.opacity=0; xh.setAttribute("stroke-opacity","0");});
}
const legend = series => `<div class="legend">${series.map(s=>s.k?`<button class="lg ${S.skOff.has(s.k)?"off":""}" data-sk="${s.k}" aria-pressed="${!S.skOff.has(s.k)}" title="${T("點擊顯示／隱藏這一項","Click to show / hide")}"><i style="background:${s.color}"></i>${esc(s.name)}</button>`:`<span><i class="${s.dash?"dash":""}" style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;

let REC=null;
function stopMic(){ if(REC){ try{ REC.__stop=true; REC.stop(); }catch(e){} } }
function setupMic(sid){
  const btn=$("#btnMic"), sel=$("#micLang"), ta=$("#note"), st=$("#saveState"), im=$("#interim");
  sel.value=store.get("y13.miclang")||(LANG==="en"?"en-US":"zh-TW");
  sel.onchange=()=>store.set("y13.miclang",sel.value);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const save=async()=>{ st.textContent=T("保存中…","Saving…"); try{ await S.db.doc("students/"+sid).update({note:ta.value}); st.textContent=T("已保存 ✓","Saved ✓"); }catch(err){ st.textContent=T("保存失敗：","Save failed: ")+(err.message||err.code); } };
  const fallback=why=>{ S.listening=false; btn.classList.remove("on"); btn.querySelector("span").textContent=T("語音輸入","Voice input"); im.textContent="";
    ta.focus(); toast(T("這裡不能直接用麥克風"+(why?"（"+why+"）":"")+"。請用鍵盤上的 🎤 聽寫，說完會自動保存。","The mic isn’t available here"+(why?" ("+why+")":"")+". Use the 🎤 dictation key on your keyboard; it autosaves."),5200); };
  btn.onclick=()=>{
    if(REC){ stopMic(); return; }
    if(!SR){ fallback(""); return; }
    let r; try{ r=new SR(); }catch(e){ fallback(""); return; }
    REC=r; r.lang=sel.value; r.continuous=true; r.interimResults=true;
    let first=true, gotAny=false;
    const d=new Date(), stamp=`【${d.getMonth()+1}/${d.getDate()}】`;
    r.onstart=()=>{ S.listening=true; btn.classList.add("on"); btn.querySelector("span").textContent=T("停止","Stop"); st.textContent=T("正在聽…","Listening…"); };
    r.onresult=e=>{ let fin="", tmp="";
      for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=t; else tmp+=t; }
      im.textContent=tmp;
      if(fin.trim()){ gotAny=true; const v=ta.value.replace(/\s+$/,"");
        const sep=first?(v?"\n":"")+stamp:(/[。！？.!?；;，,]$/.test(v)?"":(r.lang.startsWith("en")?". ":"。"));
        ta.value=v+sep+fin.trim(); first=false; ta.scrollTop=ta.scrollHeight; save(); } };
    r.onerror=e=>{ const c=e.error; REC=null; if(c==="not-allowed"||c==="service-not-allowed"||c==="audio-capture") fallback(c==="audio-capture"?T("找不到麥克風","no microphone"):T("沒有麥克風權限","no mic permission")); else if(c!=="aborted"&&c!=="no-speech") toast(T("語音識別出錯：","Speech error: ")+c); };
    r.onend=()=>{ const again=!r.__stop&&REC===r; if(again){ try{ r.start(); return; }catch(e){} }
      if(REC===r) REC=null; S.listening=false; btn.classList.remove("on"); btn.querySelector("span").textContent=T("語音輸入","Voice input"); im.textContent=""; if(!gotAny&&st.textContent===T("正在聽…","Listening…")) st.textContent=T("自動保存","Autosaves"); if(S.pendingRender){ S.pendingRender=false; render(); } };
    try{ r.start(); }catch(e){ REC=null; fallback(""); }
  };
}

  const prompt=`你是中學語言科老師的助手。根據下面的成績數據、規則生成的初稿和老師觀察，寫一段給學生和家長的評語。
要求：先寫繁體中文（120–180字，句子簡單清楚，學生能讀懂），空一行，再寫對應的英文版本。內容包括：具體優勢、一到兩個需要改進的地方（用數據說明）、兩條可操作的練習建議。只用「${nm(sid)}」稱呼學生，不要編造數據裏沒有的事實。只輸出評語正文。
數據：${JSON.stringify(data)}`;

}

    const host=document.createElement("div");
    node.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #16202a;padding-bottom:10px"><div><div style="font-size:12px;letter-spacing:.12em;color:#5b6b7a">CLASS LEARNING REPORT</div><div style="font-size:26px;font-weight:700">${esc(nm(sid))} 學習報告 Progress Report</div></div><div style="text-align:right;font-size:12px;color:#5b6b7a">${new Date().toISOString().slice(0,10)}</div></div>
    <div style="display:flex;gap:28px;margin:18px 0"><div><div style="color:#5b6b7a;font-size:12px">最近等級 Latest grade</div><div style="font-size:28px;font-weight:700">${esc(A.latest?.r.grade??"—")}</div></div><div><div style="color:#5b6b7a;font-size:12px">目標 Target</div><div style="font-size:28px;font-weight:700">${esc(A.targetLabel)}</div></div>${SK.filter(k=>A.sk[k].n).map(k=>`<div><div style="color:#5b6b7a;font-size:12px">${SKN[k]} ${SKE[k]}</div><div style="font-size:22px;font-weight:600;color:${colors[k]}">${pt25(A.sk[k].pct)}/25</div></div>`).join("")}</div>
    <div id="pdfChart" style="margin-bottom:12px"></div>
    <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px"><tr style="background:#eef2f5">${["評估 Assessment",...SK.map(k=>SKN[k]),"總分 %","等級"].map(h=>`<th style="padding:5px 6px;text-align:left">${h}</th>`).join("")}</tr>${as.map(a=>{const r=sc(a.id,sid); if(!r) return ""; return `<tr>${[a.name+(isSingle(a)?"（單項）":""),...SK.map(k=>r.skills?.[k]?(r.skills[k].grade??fmtPct(r.skills[k].pct)+"%"):"—"),isSingle(a)?"—":fmtPct(r.pct),isSingle(a)?"—":(r.grade??"—")].map(v=>`<td style="padding:5px 6px;border-bottom:1px solid #dde3e8">${esc(v)}</td>`).join("")}</tr>`;}).join("")}</table>
    <div style="white-space:pre-wrap;border:1px solid #cfd8df;border-radius:6px;padding:12px 14px">${esc($("#comment").textContent)}</div>`;
    document.body.appendChild(node);
    const fa=fullAs(); const labels=fa.map(a=>a.name);
    const vals=fa.map(a=>sc(a.id,sid)?.pct??null);
    const W=698,H=170,L=34,R=10,T=10,B=26; const mn=Math.min(60,...vals.filter(v=>v!=null).map(v=>Math.floor(v/10)*10));
    const x=i=>labels.length<=1?L+(W-L-R)/2:L+(W-L-R)*i/(labels.length-1), y=v=>T+(H-T-B)*(1-(v-mn)/(100-mn));
    let p="",st=false; vals.forEach((v,i)=>{ if(v==null) return; p+=(st?"L":"M")+x(i)+","+y(v); st=true; });
    let svg=`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
    for(let v=mn; v<=100; v+=(100-mn)/4) svg+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8ee"/><text x="${L-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#7a8896">${Math.round(v)}</text>`;
    labels.forEach((l,i)=>svg+=`<text x="${x(i)}" y="${H-8}" font-size="10.5" text-anchor="middle" fill="#5b6b7a">${esc(l)}</text>`);
    svg+=`<path d="${p}" fill="none" stroke="#0e7c86" stroke-width="2.2"/>`; vals.forEach((v,i)=>{ if(v!=null) svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#0e7c86"/>`; });
    node.querySelector("#pdfChart").innerHTML=`<div style="font-size:12px;color:#5b6b7a;margin-bottom:4px">總分趨勢 Overall score (%)</div>`+svg+"</svg>";
    const canvas=await window.html2canvas(node,{scale:2,backgroundColor:"#ffffff"});
    node.remove();
    const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4"}); const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const ih=canvas.height*pw/canvas.width; const img=canvas.toDataURL("image/jpeg",0.92);
    let off=0; pdf.addImage(img,"JPEG",0,0,pw,ih); while(ih-off>ph){ off+=ph; pdf.addPage(); pdf.addImage(img,"JPEG",0,-off,pw,ih); }
    const blob=pdf.output("blob");
    await dl.save({filename:`${nm(sid)}_${sid}_學習報告.pdf`,data:blob}).then(r=>{ if(r.status==="saved") toast(T("已導出","Exported")); }).catch(e=>{ if(e.code!=="declined"&&e.code!=="cancelled") toast("導出失敗："+(e.message||e.code)); });
  }catch(e){ toast("導出失敗："+e.message); }
  btn.disabled=false; btn.textContent=T("導出家長版 PDF","Export parent PDF");
}

/* ---------- entry modal ---------- */
function closeModal(){ $("#modalRoot").innerHTML=""; }
function openEntry(aid){
  const a=aid?S.assessments.find(x=>x.id===aid):null; const cs=codes();
  const used=SK.filter(k=>a? cs.some(c=>sc(a.id,c)?.skills?.[k]) : k!=="oral");
  const maxOf=k=>{ if(a){ const s=cs.map(c=>sc(a.id,c)?.skills?.[k]?.max).find(Boolean); if(s) return s; } return {reading:40,writing:30,listening:25,oral:30}[k]; };
  $("#modalRoot").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="box">
    <div class="row" style="justify-content:space-between"><h3 id="mTitle">${a?"編輯評估："+esc(a.name):"新增評估"}</h3><button class="btn ghost" id="mClose">關閉</button></div>
    <div class="form-grid">
      <label>名稱<input type="text" id="mName" value="${esc(a?.name||"")}" placeholder="例如 Mock 或 作業 3"></label>
      <label>類型<select id="mType">${TYPES.map(t=>`<option ${a?.type===t?"selected":""}>${t}</option>`).join("")}</select></label>
      <label>日期<input type="date" id="mDate" value="${esc(a?.date||"")}"></label>
      <label>順序（越大越新）<input type="number" id="mOrder" value="${a?.order??(Math.max(0,...S.assessments.map(x=>x.order||0))+1)}"></label>
    </div>
    <label class="row note-s" style="gap:6px"><input type="checkbox" id="mSingle" ${a&&isSingle(a)?"checked":""}> 單項成績（例如口語考、單獨的寫作作業）：只計入對應技能，不計入總分和總評等級</label>
    <div class="row">${SK.map(k=>`<label class="row note-s" style="gap:6px"><input type="checkbox" id="use_${k}" ${used.includes(k)?"checked":""}> ${SKN[k]} 滿分 <input type="number" id="max_${k}" value="${maxOf(k)}" style="width:64px"></label>`).join("")}</div>
    <p class="note-s" style="margin:0">填原始分（會按滿分換算成 %）。技能等級和總評等級可選填，例如 7、6+、6+/7-。留空表示沒有這項。</p>
    <div class="tbl-wrap"><table class="entry"><thead><tr><th>${T("學生","Student")}</th>${SK.map(k=>`<th class="c sk_${k}">${SKN[k]} 分</th><th class="c sk_${k}">等級</th>`).join("")}<th class="c">總評等級</th></tr></thead><tbody>
    ${cs.map(c=>{const r=a?sc(a.id,c):null; return `<tr><td><b>${esc(nm(c))}</b> <span class="note-s num">${esc(c)}</span></td>${SK.map(k=>`<td class="sk_${k}"><input type="number" step="any" data-c="${esc(c)}" data-k="${k}" data-f="raw" value="${r?.skills?.[k]?.raw??""}"></td><td class="sk_${k}"><input type="text" data-c="${esc(c)}" data-k="${k}" data-f="grade" value="${esc(r?.skills?.[k]?.grade??"")}"></td>`).join("")}<td><input type="text" data-c="${esc(c)}" data-f="og" value="${esc(r?.grade??"")}"></td></tr>`;}).join("")}
    </tbody></table></div>
    <div class="row" style="justify-content:space-between"><span>${a?`<button class="btn ghost" id="mDel" style="color:var(--red)">刪除這次評估</button>`:""}</span><span class="row"><span class="err" id="mErr"></span><button class="btn primary" id="mSave">保存</button></span></div>
    <div id="mConfirm"></div>
  </div></div>`;
  const syncCols=()=>SK.forEach(k=>document.querySelectorAll(".sk_"+k).forEach(el=>el.style.display=$("#use_"+k).checked?"":"none"));
  SK.forEach(k=>$("#use_"+k).addEventListener("change",syncCols)); syncCols();
  $("#mClose").onclick=closeModal;
  $("#mSave").onclick=async()=>{
    const name=$("#mName").value.trim(); if(!name){ $("#mErr").textContent="請填寫評估名稱"; return; }
    const id=a?.id||("a"+Date.now().toString(36));
    const use=SK.filter(k=>$("#use_"+k).checked), mx=Object.fromEntries(SK.map(k=>[k,+$("#max_"+k).value||100]));
    $("#mSave").disabled=true; $("#mErr").textContent="";
    try{
      await S.db.doc("assessments/"+id).set({name,type:$("#mType").value,date:$("#mDate").value||null,order:+$("#mOrder").value||0,single:$("#mSingle").checked,source:a?.source||"manual"});
      for(const c of cs){
        const skills={};
        use.forEach(k=>{ const raw=document.querySelector(`input[data-c="${CSS.escape(c)}"][data-k="${k}"][data-f="raw"]`).value; const gr=document.querySelector(`input[data-c="${CSS.escape(c)}"][data-k="${k}"][data-f="grade"]`).value.trim(); if(raw!==""){ skills[k]={raw:+raw,max:mx[k],pct:Math.round(+raw/mx[k]*1000)/10,grade:gr||null}; } });
        const og=document.querySelector(`input[data-c="${CSS.escape(c)}"][data-f="og"]`).value.trim();
        const ref=S.db.doc(`scores/${id}__${c}`);
        if(!Object.keys(skills).length && !og){ if(sc(id,c)) await ref.delete(); continue; }
        const tot=Object.values(skills); const pct=tot.length? Math.round(tot.reduce((s,v)=>s+v.pct,0)/tot.length*10)/10 : null; /* 每項技能先折成 25 分制，各佔同等比重 */
        await ref.set({aid:id,sid:c,skills,pct,grade:og||null});
      }
      closeModal(); toast("已保存"); tick();
    }catch(e){ $("#mErr").textContent="保存失敗："+(e.message||e.code); $("#mSave").disabled=false; }
  };
  if(a) $("#mDel").onclick=()=>{
    $("#mConfirm").innerHTML=`<div class="row" style="justify-content:flex-end;gap:8px"><span class="err">確定刪除「${esc(a.name)}」和全部學生這次的分數？刪除後無法恢復。</span><button class="btn" id="mDelNo">取消</button><button class="btn" id="mDelYes" style="border-color:var(--red);color:var(--red)">確定刪除</button></div>`;
    $("#mDelNo").onclick=()=>$("#mConfirm").innerHTML="";
    $("#mDelYes").onclick=async()=>{ try{ for(const c of cs){ if(sc(a.id,c)) await S.db.doc(`scores/${a.id}__${c}`).delete(); } await S.db.doc("assessments/"+a.id).delete(); closeModal(); toast("已刪除"); }catch(e){ $("#mErr").textContent="刪除失敗："+(e.message||e.code); } };
  };
}

/* ---------- import ---------- */
function openImportHelp(){
  $("#modalRoot").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="iTitle"><div class="box">
    <div class="row" style="justify-content:space-between"><h3 id="iTitle">導入表格</h3><button class="btn ghost" id="iClose">關閉</button></div>
    <p style="margin:0;max-width:70ch">上傳 Excel 或 CSV，每行是一個學生在一次評估的成績。必填列：<b>學生代號</b>、<b>評估名稱</b>。可選列：類型、日期、閱讀、寫作、聽力、口語、等級。技能列可以寫「得分/滿分」（如 33/40）或直接寫百分比（如 82.5）。同名評估會更新，新名稱會新建一次評估。表裏只用代號，不要放學生姓名。</p>
    <div class="row"><button class="btn" id="iTpl">下載範本</button><button class="btn primary" id="iPick">選擇文件</button><span class="err" id="iErr"></span></div>
  </div></div>`;
  $("#iClose").onclick=closeModal;
  $("#iPick").onclick=()=>$("#fileImport").click();
  $("#iTpl").onclick=async()=>{ const dl=await claude.use("downloads"); if(!dl){ $("#iErr").textContent="這個視圖無法下載文件"; return; } const csv="﻿學生代號,評估名稱,類型,日期,閱讀,寫作,聽力,口語,等級\nS01,Mock,Mock,2026-12-10,34/40,25/30,22/25,26/30,7\nS02,Mock,Mock,2026-12-10,31/40,22/30,21/25,24/30,6+\n"; dl.save({filename:"成績導入範本.csv",data:csv}).catch(()=>{}); };
}
function parseCell(v){
  if(v===null||v===undefined||v==="") return null;
  const s=String(v).trim(); const m=s.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
  if(m) return {raw:+m[1],max:+m[2],pct:Math.round(+m[1]/+m[2]*1000)/10};
  const n=parseFloat(s.replace("%","")); if(isNaN(n)) return null; return {raw:n,max:100,pct:n};
}
async function importFile(file){
  try{
    await loadLib(URL_XLSX);
    const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    const col=(r,...names)=>{ for(const n of names){ const key=Object.keys(r).find(k=>k.trim().toLowerCase()===n.toLowerCase()); if(key!==undefined) return r[key]; } return ""; };
    const map={reading:["閱讀","阅读","reading"],writing:["寫作","写作","writing"],listening:["聽力","听力","listening"],oral:["口語","口语","oral","speaking"]};
    let n=0, newA={}, unknown=new Set();
    let nextOrder=Math.max(0,...S.assessments.map(x=>x.order||0));
    for(const r of rows){
      const c=String(col(r,"學生代號","学生代号","code")).trim(); const an=String(col(r,"評估名稱","评估名称","assessment")).trim();
      if(!c||!an) continue;
      if(!S.students[c]){ unknown.add(c); await S.db.doc("students/"+c).set({code:c,target:"7",note:""}); S.students[c]={code:c,target:"7",note:""}; }
      let a=S.assessments.find(x=>x.name===an)||newA[an];
      if(!a){ a={id:"a"+Date.now().toString(36)+Object.keys(newA).length,name:an,type:String(col(r,"類型","类型","type")).trim()||"其他",date:String(col(r,"日期","date")).trim()||null,order:++nextOrder,source:"upload"}; newA[an]=a; await S.db.doc("assessments/"+a.id).set({name:a.name,type:a.type,date:a.date,order:a.order,source:"upload"}); }
      const skills={}; SK.forEach(k=>{ const p=parseCell(col(r,...map[k])); if(p) skills[k]={...p,grade:null}; });
      const tot=Object.values(skills); const pct=tot.length?Math.round(tot.reduce((s,v)=>s+v.pct,0)/tot.length*10)/10:null;
      await S.db.doc(`scores/${a.id}__${c}`).set({aid:a.id,sid:c,skills,pct,grade:String(col(r,"等級","等级","grade")).trim()||null}); n++;
    }
    closeModal(); toast(`已導入 ${n} 行`+(unknown.size?`，新增學生 ${[...unknown].join("、")}`:"")); tick();
  }catch(e){ const el=$("#iErr"); if(el) el.textContent="導入失敗："+(e.message||e.code); else toast("導入失敗："+(e.message||e.code)); }
}

/* ---------- events ---------- */
function toggleSk(k){ if(S.skOff.has(k)) S.skOff.delete(k); else { const shown=SK.filter(x=>!S.skOff.has(x)); if(shown.length<=1) { toast(T("至少保留一項技能","Keep at least one skill")); return; } S.skOff.add(k); } store.set("y13.skoff",[...S.skOff]); tick(); render(); }
document.addEventListener("keydown",e=>{ const s=e.target.closest&&e.target.closest(".sc[data-sk]"); if(s&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); toggleSk(s.dataset.sk); } });
document.addEventListener("click",e=>{ const sk=e.target.closest("[data-sk]"); if(sk){ toggleSk(sk.dataset.sk); return; } const t=e.target.closest("[data-go]"); if(t){ go(t.dataset.go); return; } const ed=e.target.closest("[data-edit]"); if(ed) openEntry(ed.dataset.edit); });
$("#btnAdd").onclick=()=>{ if(!S.db) return toast("數據庫未連接"); openEntry(null); };
$("#btnImport").onclick=()=>{ if(!S.db) return toast("數據庫未連接"); openImportHelp(); };
$("#fileImport").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if(f) importFile(f); };
$("#btnSolo").onclick=()=>{ if(S.view==="class") return; S.solo=!S.solo; ratchet(); render(); };
$("#btnSoloExit").onclick=()=>{ S.solo=false; ratchet(); render(); };
const paintSound=()=>{ $("#btnSound").setAttribute("aria-pressed",soundOn); $("#btnSound").textContent=soundOn?T("♪ 音效開","♪ Sound on"):T("♪ 音效關","♪ Sound off"); $("#btnSound").title=T("齒輪音效","Gear sound"); };
$("#btnSound").onclick=()=>{ soundOn=!soundOn; store.set("y13.sound",soundOn); paintSound(); ensureAudio(); if(soundOn) setTimeout(()=>tick(),30); };
let paintFull=null;
function paintStatic(){
  document.documentElement.lang=T("zh-Hant","en");
  const set=(sel,z,e)=>{ const el=$(sel); if(el) el.textContent=T(z,e); };
  set(".brand .sub","學習數據看板","Learning dashboard"); set(".brand h1","示範班級","Demo class");
  set("#btnAdd","＋ 新增評估","＋ Add assessment");
  set("#btnImport","導入表格","Import sheet");
  set("#btnSolo","單人模式","Single-student mode");
  set(".solo-banner span","單人模式：只顯示這位同學的數據","Single-student mode: showing this student only");
  set("#btnSoloExit","退出","Exit");
  set(".demo-tag","示範數據 · 姓名與分數均為虛構","Demo data · names and scores are fictional");
  $("#btnSolo").title=T("面談時只顯示當前學生","Show only the current student in meetings");
  $("#switcher").setAttribute("aria-label",T("切換學生","Switch student"));
  const bl=$("#btnLang"); bl.textContent=LANG==="en"?"中文":"EN"; bl.title=T("切換成英文","切換成中文 Switch to Chinese");
  paintSound(); if(paintFull) paintFull();
}
$("#btnLang").onclick=()=>{ LANG=LANG==="en"?"zh":"en"; store.set("y13.lang",LANG); ratchet(); paintStatic(); if(S.ready.a&&S.ready.s&&S.ready.st) render(); };
(()=>{ const b=$("#btnFull"), el=document.documentElement; const req=el.requestFullscreen||el.webkitRequestFullscreen; if(!req) return; b.hidden=false;
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const paint=()=>{ const on=!!fsEl(); b.setAttribute("aria-pressed",on); b.textContent=on?T("⛶ 退出全螢幕","⛶ Exit full screen"):T("⛶ 全螢幕","⛶ Full screen"); b.title=T("全螢幕顯示","Full screen"); }; paintFull=paint;
  b.onclick=async()=>{ try{ if(fsEl()) await (document.exitFullscreen||document.webkitExitFullscreen).call(document); else await req.call(el); }catch(e){ toast("這個視圖不支持全螢幕，可以按瀏覽器的全螢幕鍵（Mac：Ctrl+Cmd+F）"); } };
  document.addEventListener("fullscreenchange",paint); document.addEventListener("webkitfullscreenchange",paint); })();
paintStatic();
let rz=null, lastW=innerWidth; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(Math.abs(innerWidth-lastW)>40 && S.ready.a && !(document.activeElement&&document.activeElement.id==="note")){ lastW=innerWidth; render(); } },200); });
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1)||"class"; if(h!==S.view && (h==="class"||S.students[h])) { S.view=h; render(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); if((e.key==="ArrowRight"||e.key==="ArrowLeft") && !e.target.closest("input,textarea,select") && !S.solo){ const list=["class",...codes()]; const i=list.indexOf(S.view); const n=list[(i+(e.key==="ArrowRight"?1:-1)+list.length)%list.length]; go(n); } });

/* ---------- boot ---------- */
(async()=>{
  const db=await claude.use("db");
  if(!db){ $("#app").innerHTML=`<div class="empty"><strong>無法連接數據庫</strong>請登錄 claude.ai 後用你自己的帳號打開這個頁面。</div>`; return; }
  S.db=db;
  let pending=null; const schedule=()=>{ if(pending) return; pending=requestAnimationFrame(()=>{ pending=null; if(!(S.ready.a&&S.ready.s&&S.ready.st)) return; const h=location.hash.slice(1); if(S.view==="class" && h && S.students[h]) S.view=h; if((document.activeElement && document.activeElement.id==="note")||S.listening) { if(S.listening) S.pendingRender=true; renderSwitcher(); return; } render(); }); };
  const fail=e=>{ $("#app").innerHTML=`<div class="empty"><strong>讀取數據失敗</strong>${esc(e.message||e.code)}</div>`; };
  db.collection("assessments").onSnapshot(q=>{ S.assessments=q.docs.map(d=>({id:d.id,...d.data()})); S.ready.a=true; schedule(); },fail);
  db.collection("scores").onSnapshot(q=>{ S.scores={}; q.docs.forEach(d=>{ const v={...d.data()}; const ps=Object.values(v.skills||{}).map(x=>x&&x.pct).filter(x=>x!=null&&!isNaN(x)); if(ps.length) v.pct=Math.round(ps.reduce((a,b)=>a+b,0)/ps.length*10)/10; S.scores[v.aid+"__"+v.sid]=v; }); S.ready.s=true; schedule(); },fail);
  db.collection("students").onSnapshot(q=>{ S.students={}; q.docs.forEach(d=>{ S.students[d.id]=d.data(); }); S.ready.st=true; schedule(); },fail);
})();
})();
</script>
