const scenes=[
{title:'走進清明上河圖',en:'Step into a Song painting',slide:2,steps:[['老張','瞧！張擇端的《清明上河圖》描繪了北宋都城的熱鬧景象。','Look at the busy streets in Zhang Zeduan’s painting.'],['老張媳婦','街上有商人、船夫，也有各種店鋪。跟我們一起逛逛吧！','Come with us to explore the shops and streets.']]},
{title:'出發：航海與指南針',en:'Setting sail and finding direction',slide:3,steps:[['老張','我們乘船出發。航行時，怎樣辨認方向呢？','How can sailors find their direction?'],['老張媳婦','指南針能幫助人們辨別方向；日晷用來計時，地動儀與地震有關。','A compass helps people find directions.']],q:{ask:'哪一件工具可以幫助船隻辨別方向？',opts:['日晷','指南針','地動儀'],correct:1,explain:'指南針是辨別方向的工具。'}},
{title:'四大發明',en:'Four great inventions',slide:4,steps:[['老張','中國古代的四大發明是造紙術、印刷術、指南針和火藥。','Papermaking, printing, the compass and gunpowder are the four great inventions.'],['老張媳婦','想一想：這些技術如何改變人們的生活？你會選什麼作為現代發明？','How did these inventions change people’s lives?']]},
{title:'帶什麼錢去逛街？',en:'Choosing money for the market',slide:5,steps:[['老張','我們先去換錢。銅錢、交子和銀錠，各有什麼不同？','Let’s exchange money before shopping.'],['老張媳婦','如果要帶大量錢款出門，輕便的紙幣會方便得多。','Paper money is easier to carry for a large purchase.']],q:{ask:'大量交易時，哪一種貨幣比較輕便？',opts:['一大串銅錢','交子','一車鐵錢'],correct:1,explain:'交子是紙幣，攜帶比沉重的金屬錢方便。'}},
{title:'交子為什麼出現？',en:'Why did jiaozi appear?',slide:6,steps:[['老張','北宋四川使用的鐵錢很重。商業發達，大額交易需要更方便的貨幣。','Heavy iron coins made large transactions inconvenient in Sichuan.'],['老張媳婦','於是出現了交子。南宋後來又出現另一種紙幣：會子。','Jiaozi appeared in the Northern Song; huizi followed in the Southern Song.']]},
{title:'走進茶坊',en:'A visit to a tea house',slide:7,steps:[['老張媳婦','小二，來一碗茶！咦，這茶怎麼有細細的泡沫？','What is this tea with a fine layer of foam?'],['老張','這是點茶。茶客還會鬥茶、玩茶百戲，茶坊也是人們相聚的地方。','Diancha was a way of preparing tea; people also competed in tea-making.']],q:{ask:'「點茶」與什麼有關？',opts:['製茶與品茶','航海導航','鑄造銅錢'],correct:0,explain:'點茶是一種宋代茶文化的表現。'}},
{title:'到成衣鋪選衣服',en:'Choosing Song clothing',slide:8,steps:[['老張媳婦','我們換上宋代衣服吧！看看褙子：前襟對稱，兩側開衩。','Let’s look at a beizi, an open-sided outer garment.'],['老張','還有不同式樣的裙子和帽子。觀察圖片，找出你喜歡的服飾。','Look closely at the skirts and hats in the pictures.']]},
{title:'設計你的宋代穿搭',en:'Design your Song outfit',slide:9,steps:[['老張媳婦','課件介紹，上衣可用淡綠、粉紫、銀灰或蔥白；下裙可選青、碧、綠或杏黃。','Choose a light colour for the top and a vivid colour for the skirt.'],['老張','現在輪到你：選顏色，說說你為什麼這樣搭配。','Choose your colours and explain your design.']]},
{title:'來吃一頓宋代飯',en:'A meal in the Song city',slide:14,steps:[['老張','逛累了，我們去吃飯。課件列出粥或米飯約三到五文，簡單葷素菜約十到二十文。','According to the lesson slides, rice or porridge cost about 3–5 coins.'],['老張媳婦','如果普通人一天收入約一百到三百文，你會怎樣安排一頓飯？','If daily income were 100–300 coins, what would you order?']],q:{ask:'按課件中的價格，一碗粥約多少錢？',opts:['3–5文','1000文','10000文'],correct:0,explain:'課件列出的粥、米飯價格是3–5文。'}},
{title:'宋代有什麼美食？',en:'Food on the Song table',slide:15,steps:[['老張媳婦','來看看汴京爊鴨和蟹釀橙。食物也能讓我們認識一個時代的生活。','Explore Song dishes such as slow-roasted duck and crab-stuffed orange.'],['老張','你最想試哪一道？說說它讓你想到什麼。','Which dish would you like to try?']]},
{title:'動手體驗',en:'Hands-on activities',slide:10,steps:[['老張','接下來可以分組體驗印交子、點茶、漢服摺紙或服飾塗色。','Try printing jiaozi, preparing tea, paper folding or colouring.'],['老張媳婦','邊做邊想：這項活動反映了宋代生活的哪一個方面？','What does your activity tell you about Song life?']]},
{title:'今天的宋朝之旅',en:'Our journey through Song life',slide:2,steps:[['老張','我們認識了指南針、貨幣，還看到了茶坊和服飾。','We explored navigation, money, tea and clothing.'],['老張媳婦','也從飲食和手作中看見宋代人的日常。下次再一起出發！','Food and crafts also give us a glimpse of everyday life.']]}
];
scenes.splice(0,scenes.length,...buildLesson().flatMap(s=>{let pages=[{...s,q:null,activity:null}];if(s.q||(s.activity&&!['古今發明小組討論','交子觀察任務','試試描述一碗茶','看看宋代食物','動手體驗','和老張夫婦告別'].includes(s.title)))pages.push({title:s.q?'想一想：'+s.title:'討論：'+s.title,en:s.q?'Your turn: '+s.en:'Think and share: '+s.en,slide:s.slide,steps:[],q:s.q,activity:s.activity,questionPage:true});if(GAME_LIST[s.title])pages.push({...GAME_LIST[s.title],game:true,steps:[]});if(s.title==='和老張夫婦告別')pages.push({id:'album',title:'老張夫婦的旅行手帳',en:'The Zhang family journey',slide:2,game:true,steps:[]});return pages}));
let index=0,step=0,playing=false,voice=false,subtitles=true,timer=null,token=0,quizShown=false;const $=s=>document.querySelector(s);$('#progress').max=scenes.length-1;
function stop(){window.stopNarration();clearTimeout(timer);token++;if('speechSynthesis'in window)speechSynthesis.cancel()}
function speak(text,done){let t=token;if(!voice||!('speechSynthesis'in window)){timer=setTimeout(()=>{if(t===token)done()},Math.max(3000,text.length*170));return}let u=new SpeechSynthesisUtterance(text);u.lang='zh-HK';u.rate=.88;u.onend=()=>{if(t===token)timer=setTimeout(done,1100)};u.onerror=()=>{if(t===token)timer=setTimeout(done,2000)};speechSynthesis.speak(u)}
function sceneArt(s){let n=s.slide;return n===3||n===4?['bg-river.png','object-compass.png']:n===5||n===6?['bg-market.png','object-jiaozi.png']:n===7||n===11?['bg-tea.png','object-tea.png']:n===8||n===9||n===12||n===13?['bg-clothes.png','object-clothes.png']:n===14?['bg-food.png','object-meal.png']:n===15?['bg-food.png','object-orange.png']:['bg-city.png',null]}
function render(){stop();let s=scenes[index],art=sceneArt(s);$('#stage').style.backgroundImage='url("assets/'+art[0]+'")';$('#stage').classList.toggle('question',!!s.questionPage);$('#stage').classList.toggle('game',!!s.game);$('#stage').classList.toggle('invention-quiz',!!s.q&&s.q.ask==='哪一項發明最直接幫助大量複製文字？');$('#heading').innerHTML=s.title+'<span class="en">'+s.en+'</span>';let originals=SOURCE[s.slide-1].images.filter(x=>x!=='image3.png');let obj=art[1]||originals[0];$('#visual').className='visual';let panel=s.slide===4?'<div class="invention-chart"><img src="assets/four-inventions.png" alt="造紙、印刷、指南針、火藥的示意圖"><div class="invention-labels"><span>造紙術<small>Papermaking</small></span><span>印刷術<small>Printing</small></span><span>指南針<small>Compass</small></span><span>火藥<small>Gunpowder</small></span></div></div>':s.slide===15?'<div class="invention-chart"><img src="assets/song-foods.png" alt="宋代食物概念示意圖"><div class="invention-labels"><span>爊鴨<small>Roast duck</small></span><span>蟹釀橙<small>Crab orange</small></span><span>果子<small>Sweets</small></span><span>飲子<small>Drinks</small></span></div></div>':'<img class="object" src="assets/'+obj+'" alt="'+(art[1]?'歷史主題示意插畫':'原課件圖片')+'">';$('#visual').innerHTML='<img class="actor" id="actor" src="assets/laozhang-original.webp" alt="老張">'+panel+(art[1]?'<figcaption>AI 示意圖 · Illustration</figcaption>':'');$('#words').innerHTML='';$('#subtitle').innerHTML='';$('#counter').textContent=(index+1)+' / '+scenes.length;$('#progress').value=index;step=0;quizShown=false;updateJourney();if(s.game){startGame(s.id);window.playGameInstruction(s.id)}else if(s.questionPage){if(s.q)showQuiz(s.q);else {let p=document.createElement('div');p.className='bubble discussion';p.innerHTML='<b>💬 思考與討論 Think and share</b><p>'+s.activity+'</p>';$('#words').append(p)}}else advance()}
function updateStepButton(){let s=scenes[index],btn=$('#play');if(index===scenes.length-1){btn.textContent='↺ 返回第一頁';btn.title='返回課件第一頁'}else if(!s.game&&!s.questionPage&&step<s.steps.length){btn.textContent='▶ 下一句 '+(step+1)+'/'+s.steps.length;btn.title='顯示下一句對話'}else{btn.textContent='▶ 前往下一頁';btn.title='前往下一頁'}btn.setAttribute('aria-label',btn.title)}
let autoPlaying=true;const autoButton=$('#autoplayToggle');autoButton.onclick=()=>{autoPlaying=!autoPlaying;autoButton.textContent=autoPlaying?'⏸ 暫停自動播放':'▶ 開始自動播放';autoButton.setAttribute('aria-pressed',String(autoPlaying));if(!autoPlaying){window.pauseNarration();window.pauseBackgroundMusic()}else{window.resumeBackgroundMusic();if(!window.resumeNarration()&&!scenes[index].questionPage&&!scenes[index].game){let text=window.getCurrentNarrationText();if(text)window.playNarration(text,()=>{if(autoPlaying&&index<scenes.length-1)advance()})}}};$('#stage').addEventListener('click',e=>{if(!$('#cover').classList.contains('hidden')||e.target.closest('button, a, input, select, textarea'))return;autoButton.click()});
window.resumeAutoNarration=()=>{if(autoPlaying&&index<scenes.length-1)advance()};
window.getCurrentNarrationText=()=>scenes[index]?.steps?.[step-1]?.[1];
function advance(){let s=scenes[index];if(s.questionPage||s.game||step>=s.steps.length){go(index===scenes.length-1?0:index+1);return}let [who,zh,en]=s.steps[step++];let actor=$('#actor');actor.src='assets/'+(who==='老張媳婦'?'laozhang-wife.png':'laozhang-original.webp');actor.alt=who;$('#words').replaceChildren();$('#subtitle').innerHTML='<span><b class="speaker">'+who+'：</b>'+zh+'</span><small>'+en+'</small>';window.playNarration(zh,()=>{if(autoPlaying&&index<scenes.length-1)advance()});updateStepButton()}
function showQuiz(q){let box=document.createElement('div');box.className='reveal bubble';let city=q.ask==='觀察畫面：哪些細節可以顯示城市很繁忙？',tools=q.ask==='哪一種工具可以辨別方向？',illustrated=q.ask==='哪一項發明最直接幫助大量複製文字？';let data=city?[['船隻與人群','Boats and crowds','city-choice-scenes.png',0],['空無一人的街道','An empty street','city-choice-scenes.png',1],['沒有店鋪的荒野','Countryside without shops','city-choice-scenes.png',2]]:tools?[['日晷','Sundial','image7.png'],['指南針','Compass','image5.png'],['地動儀','Seismoscope','image6.png']]:quizCards[q.ask];$('#stage').classList.toggle('picture-quiz',!!data);box.innerHTML='<p><b>✦ 想一想</b> '+q.ask+'<span class="en">'+(q.en||'')+'</span></p>'+(city?'<div class="painting-ref"><img src="assets/image4.png" alt="原課件的清明上河圖"><span>觀察原課件畫面<br>Painting in the source slide</span></div>':'')+'<div class="choices"></div><p class="feedback" aria-live="polite"></p>';$('#words').append(box);let cards=[['印刷術','Printing','33.333%'],['指南針','Compass','66.667%'],['火藥','Gunpowder','100%']];q.opts.forEach((o,i)=>{let b=document.createElement('button');if(illustrated){let [zh,en,pos]=cards[i];b.setAttribute('aria-label',zh+' '+en);b.innerHTML='<span class="invent-pic" style="background-position:'+pos+' center"></span><span>'+zh+'</span><span class="invent-en">'+en+'</span>'}else if(data){let [zh,en,img,pos]=data[i];b.setAttribute('aria-label',zh+' '+en);let visual=img==='amount'?'<span class="choice-number">🪙 '+pos+' 文</span>':img==='fraction'?'<span class="choice-number"><span class="fraction" style="background:conic-gradient(#a96e3a '+pos+'%,#f3e5cc '+pos+'%)"></span></span>':'<span class="choice-pic" style="background-image:url(assets/'+img+');'+(typeof pos==='number'?'background-size:300% 100%;background-position:'+(pos*50)+'% center;':'background-size:contain;')+'"></span>';b.innerHTML=visual+'<span>'+zh+'</span><span class="choice-en">'+en+'</span>'}else b.textContent=o;b.onclick=()=>{b.className=i===q.correct?'correct':'wrong';box.querySelector('.feedback').textContent=i===q.correct?'答對了！'+q.explain+' 按「下一步」繼續。':'再想一想，試試其他選項。'};box.querySelector('.choices').append(b)});box.scrollIntoView({block:'nearest'})}
const originalShowQuiz=showQuiz;showQuiz=function(q){originalShowQuiz(q);if(q.ask==='觀察畫面：哪些細節可以顯示城市很繁忙？')window.playCityQuestion();document.querySelectorAll('#words .choices button').forEach((b,i)=>b.addEventListener('click',()=>{let fb=document.querySelector('#words .feedback');let en=document.createElement('span');en.className='feedback-en';if(i===q.correct){celebrate(false);window.playFeedback(q.ask,()=>{if(autoPlaying&&index<scenes.length-1)go(index+1)})}else{window.playRetry()}en.textContent=i===q.correct?'Correct! '+(feedbackEnglish[q.ask]||'')+' Continue to the next page.':'Try again. Choose another answer.';fb.append(en)}))};
const renderScene=render;render=function(){renderScene();if(scenes[index].slide===15&&!scenes[index].questionPage&&!scenes[index].game){let img=document.querySelector('.invention-chart img');if(img){let strip=document.createElement('div');strip.className='food-strip';strip.setAttribute('aria-label','爊鴨、蟹釀橙、果子、飲子');strip.innerHTML='<span style="background-position:0% center"></span><span style="background-position:33.333% center"></span><span class="source-food" title="原課件圖片：冰雪冷元子"></span><span style="background-position:100% center"></span>';img.replaceWith(strip);let cap=document.querySelector('.visual figcaption');if(cap)cap.textContent='部分為 AI 示意圖 · Some images are illustrations'}}updateStepButton()};
function go(i){index=Math.max(0,Math.min(scenes.length-1,i));$('#stage').classList.remove('picture-quiz');render()}$('#start').onclick=()=>{$('#cover').classList.add('hidden');render()};$('#prev').onclick=()=>go(index-1);$('#next').onclick=()=>go(index+1);$('#play').onclick=advance;$('#progress').oninput=e=>go(+e.target.value);$('#resetGame').onclick=()=>{if(confirm('重新開始將清除本機的生活值、徽章與服飾搭配。確定重置嗎？')){gameState={earned:[],outfit:null};saveGame();updateJourney();render()}};$('#subs').onclick=()=>{subtitles=!subtitles;$('#subtitle').style.visibility=subtitles?'visible':'hidden'};$('#full').onclick=()=>{if(!document.fullscreenElement)document.querySelector('main').requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1);if(e.key===' '){e.preventDefault();advance()}if(e.key.toLowerCase()==='f')$('#full').click()});$('#counter').textContent='1 / '+scenes.length;updateJourney();
</script></body></html>
