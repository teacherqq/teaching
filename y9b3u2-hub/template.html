<title>選擇與溝通 · 單元課件</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: one dark stage. A fan of five lesson cards sits on a lit floor, giant outlined 溝通 behind, lesson detail below. */
:root{
  --ink:#0d0c14;        /* night desk */
  --ink-2:#17151f;
  --paper:#f6efe2;      /* letter paper */
  --text:#efe9df;
  --muted:#a59f97;
  --line:rgba(239,233,223,.12);
  --glow:#f08a5d;
  --kai:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --cw:clamp(138px,19vw,232px);
  --ch:calc(var(--cw)*1.42);
  --ease:cubic-bezier(.22,.9,.3,1);
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--sans);min-height:100%;overflow-x:hidden}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding-block:clamp(28px,6vw,64px) 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vw,20px);overflow-x:clip}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.aura{position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:radial-gradient(40% 35% at 50% 58%,color-mix(in srgb,var(--glow) 34%,transparent),transparent 70%),
             radial-gradient(60% 50% at 50% 110%,rgba(120,90,200,.18),transparent 70%);
  transition:background 600ms ease}
.wrap>*{position:relative;z-index:1}

header{text-align:center;display:grid;gap:10px;justify-items:center}
.eyebrow{font-size:12px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;display:flex;gap:10px;align-items:center}
.eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:var(--line)}
h1{font-family:var(--kai);font-weight:700;font-size:clamp(40px,7vw,76px);line-height:1.05;margin:0;letter-spacing:.08em;
  background:linear-gradient(180deg,#fff 20%,#d9cbb6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-wrap:balance;filter:drop-shadow(0 6px 24px rgba(0,0,0,.6))}
.lede{font-family:var(--kai);font-size:clamp(16px,2.2vw,20px);color:#cfc6b8;margin:0;letter-spacing:.06em}

/* stage */
.stage{position:relative;width:100%;height:calc(var(--ch)*1.62);perspective:1500px;perspective-origin:50% 30%;touch-action:pan-y;outline:none}
.ghost{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--kai);font-weight:700;white-space:nowrap;
  font-size:clamp(110px,24vw,300px);letter-spacing:.2em;color:transparent;-webkit-text-stroke:1.5px rgba(239,233,223,.08);
  user-select:none;pointer-events:none;line-height:1}
.floor{position:absolute;left:50%;bottom:4%;width:min(100%,900px);height:34%;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,rgba(255,240,220,.10),transparent 70%);filter:blur(4px)}
.fan{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.slot{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);margin:calc(var(--ch)/-2) 0 0 calc(var(--cw)/-2);
  transform-style:preserve-3d;transition:transform 300ms var(--ease);will-change:transform;text-decoration:none;color:inherit;
  -webkit-tap-highlight-color:transparent;outline:none}
.deal{width:100%;height:100%;transform-style:preserve-3d;animation:deal 900ms var(--ease) both;animation-delay:calc(var(--i)*90ms + 150ms)}
@keyframes deal{from{transform:translate3d(0,60vh,-200px) rotateX(40deg)}to{transform:none}}
.bob{width:100%;height:100%;transform-style:preserve-3d;animation:bob 5.5s ease-in-out infinite;animation-delay:calc(var(--i)*-1.1s)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.slot.on .bob{animation-play-state:paused}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform 160ms ease-out}

/* thickness: stacked plates behind the face */
.plate{position:absolute;inset:0;border-radius:22px;background:var(--c2);transform:translateZ(calc(var(--k)*-1.6px))}
.plate:last-of-type{box-shadow:0 40px 60px -18px rgba(0,0,0,.75)}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;--pad:calc(var(--cw)*.05);--band:calc(var(--ch)*.22);
  background:linear-gradient(165deg,var(--c1) 0%,var(--c) 55%,var(--c2) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.15);
  transition:box-shadow 300ms ease}
.slot.on .face{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 0 1px rgba(255,255,255,.18),0 0 70px -6px var(--c)}
.win{position:absolute;left:var(--pad);right:var(--pad);top:var(--pad);bottom:var(--band);border-radius:15px;overflow:hidden;
  background:var(--c2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 6px 14px -6px rgba(0,0,0,.45)}
.art{position:absolute;inset:0;background-size:cover;background-position:var(--pos,center);
  transform:scale(1.02);transition:transform 600ms var(--ease)}
.slot.on .art{transform:scale(1.1)}
.txt{position:absolute;left:0;right:0;bottom:0;height:var(--band);padding:0 calc(var(--pad) + 4px);display:flex;flex-direction:column;justify-content:center}
.txt h3{margin:0;font-family:var(--kai);font-weight:700;font-size:calc(var(--cw)*.098);line-height:1.15;color:#fff;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.25);letter-spacing:.04em;text-wrap:balance}
.txt p{margin:4px 0 0;font-size:clamp(10px,1.1vw,12px);white-space:nowrap;letter-spacing:.14em;color:rgba(255,255,255,.82)}
.glare{position:absolute;inset:0;border-radius:22px;pointer-events:none;opacity:0;transition:opacity 300ms;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.45),rgba(255,255,255,0) 45%);mix-blend-mode:overlay}
.slot.on .glare{opacity:1}
.sheen{position:absolute;inset:0;border-radius:22px;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);
  background-size:250% 100%;background-position:120% 0;transition:background-position 900ms var(--ease)}
.slot.on .sheen{background-position:-40% 0}

/* pop-out pieces that float in front of the card */
.pop{position:absolute;transform-style:preserve-3d;transition:transform 300ms var(--ease);pointer-events:none}
.tag{bottom:calc(var(--ch)*.22 - 14px);right:-14px;transform:translateZ(36px);padding:5px 12px;border-radius:999px;background:var(--paper);color:var(--c2);
  font-family:var(--kai);font-weight:700;font-size:clamp(11px,1.2vw,14px);letter-spacing:.12em;
  box-shadow:0 10px 20px -6px rgba(0,0,0,.5),inset 0 -2px 0 rgba(0,0,0,.08)}
.slot.on .tag{transform:translateZ(70px) translateY(-6px)}
.note{left:-16px;bottom:9%;width:68%;transform:translateZ(46px) rotate(-6deg);
  background:var(--paper);color:#3b332b;border-radius:6px;padding:8px 10px 10px;font-family:var(--kai);
  font-size:clamp(9px,1.05vw,12px);line-height:1.5;box-shadow:0 18px 30px -10px rgba(0,0,0,.6)}
.note b{display:block;font-size:1.15em;color:#1f1a15}
.slot.on .note{transform:translateZ(90px) rotate(-3deg) translate(-6px,4px)}
.note.photo{padding:6px 6px 16px;width:72%;bottom:12%}
.note.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2px}
.note.photo span{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:.85em;color:#6b6157}
.note.mail{font-family:var(--sans);font-size:clamp(8px,.95vw,11px)}
.note.mail i{font-style:normal;color:#8a7f73}
.note.bubble{border-radius:14px 14px 14px 4px}
/* coming-soon glyph: extruded character instead of a picture */
.glyph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kai);font-weight:700;
  font-size:calc(var(--cw)*.5);color:rgba(255,255,255,.92);line-height:1;
  text-shadow:1px 1px 0 var(--c2),2px 2px 0 var(--c2),3px 3px 0 var(--c2),4px 4px 0 var(--c2),5px 5px 0 var(--c2),6px 6px 0 var(--c2),
              8px 14px 24px rgba(0,0,0,.35)}
.dots::after{content:"";position:absolute;inset:0;opacity:.18;
  background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1.4px);background-size:14px 14px}
.soon{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);padding:4px 12px;border-radius:999px;font-size:11px;letter-spacing:.2em;
  color:#fff;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.35);white-space:nowrap}
.slot.nudge .card{animation:nudge 380ms ease}
@keyframes nudge{20%{transform:rotateY(-10deg)}50%{transform:rotateY(8deg)}80%{transform:rotateY(-4deg)}}
.slot:focus-visible .face{outline:3px solid #fff;outline-offset:3px}

/* detail panel */
.detail{width:min(100%,640px);display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:start;
  padding:18px 22px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--line);backdrop-filter:blur(8px)}
.detail .num{grid-row:span 3;font-family:var(--kai);font-weight:700;font-size:44px;line-height:1;color:var(--glow);transition:color 400ms;min-width:1.2em;text-align:center}
.detail .k{font-size:12px;letter-spacing:.24em;color:var(--muted)}
.detail h2{margin:0;font-family:var(--kai);font-size:clamp(22px,3vw,28px);letter-spacing:.06em;color:#fff}
.detail p{margin:0;font-family:var(--kai);font-size:16px;line-height:1.75;color:#d8d0c4;min-width:0}
.detail .row{grid-column:2;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}
.go{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;text-decoration:none;font-weight:500;font-size:14px;letter-spacing:.1em;
  color:#1a140f;background:var(--paper);box-shadow:0 8px 20px -8px var(--glow);transition:transform 200ms,box-shadow 300ms}
.go:hover{transform:translateY(-2px)}
.go[aria-disabled="true"]{background:transparent;color:var(--muted);border:1px dashed var(--line);box-shadow:none;pointer-events:none}
.hint{font-size:12px;color:var(--muted);letter-spacing:.08em}
.fade{animation:fade 360ms ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fs{position:fixed;z-index:20;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));
  display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;cursor:pointer;
  font:500 13px/1 var(--sans);letter-spacing:.12em;color:var(--text);background:rgba(255,255,255,.07);
  border:1px solid var(--line);backdrop-filter:blur(8px);transition:background 200ms,transform 200ms}
.fs:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.fs:focus-visible{outline:2px solid #fff;outline-offset:2px}
.fs svg{width:16px;height:16px}
footer{font-size:12px;color:#6f6a64;letter-spacing:.12em;margin-top:8px;text-align:center}
@media (max-width:560px){
  .detail{grid-template-columns:1fr;padding:16px}
  .detail .num{grid-row:auto;text-align:left;font-size:34px}
  .detail .row{grid-column:1}
  .note{font-size:8px;opacity:0;transition:opacity 300ms,transform 300ms var(--ease)}
  .slot.on .note{opacity:1}
}
@media (prefers-reduced-motion:reduce){
  .slot,.pop,.art{transition-duration:1ms}
  .deal,.bob{animation:none}
}
</style>

<div class="aura" id="aura"></div>
<canvas id="dust" aria-hidden="true"></canvas>

<button class="fs" id="fs" type="button" hidden aria-label="全螢幕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path id="fsi" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span id="fst">全螢幕</span></button>
<main class="wrap">
  <header>
    <div class="eyebrow">九年級 · 第三組 · 第二單元</div>
    <h1>選擇與溝通</h1>
    <p class="lede">一次單元導入，四篇課文</p>
  </header>

  <div class="stage" id="stage" aria-label="單元課件">
    <div class="ghost" aria-hidden="true">溝通</div>
    <div class="floor"></div>
    <div class="fan" id="fan"></div>
  </div>

  <section class="detail" id="detail" aria-live="polite"></section>
  <footer>漢基國際學校 · 中文部 · 九年級課堂互動課件</footer>
</main>

<script>
// ready:false keeps a built-but-not-deployed lesson's card visible without a link; delete it once that lesson is live.
const LESSONS=[

 {id:"00",num:"導",kicker:"單元導入",title:"單元總覽與溝通導入討論",card:"單元總覽",cardSub:"溝通導入討論",genre:"總覽",
  c:"#e9805a",c1:"#f6b38f",c2:"#9c4a2e",art:"__C0__",
  sum:"認識本單元的四篇課文和評估任務，再看《家有兒女》片段，討論怎樣的溝通才算有效。",
  href:"https://teacherqq.github.io/teaching/y9b3u2-00/",
  pos:'center 30%'},
 {id:"01",num:"一",kicker:"第一課 · 書信",title:"給媽媽的一封信",genre:"書信",
  c:"#dba23a",c1:"#f3d27b",c2:"#8f6418",art:"__C1__",
  sum:"媽媽關掉了家裡的網絡。女兒安心用媽媽喜歡的寫信方式，說出自己對網絡交流的看法。",
  href:"https://teacherqq.github.io/teaching/y9b3u2/",},
 {id:"02",num:"二",kicker:"第二課 · 日記",title:"日記一篇",genre:"日記",
  c:"#4f9a6c",c1:"#8fcaa0",c2:"#2a5e40",art:"__C2__",
  sum:"為了大學讀藝術還是醫學、法律，「我」和爸媽吵了一架。睡前寫下日記，決定明天再好好談。",
  href:"https://teacherqq.github.io/teaching/y9b3u2-02/",},
 {id:"03",num:"三",kicker:"第三課 · 對話",title:"抉擇",genre:"對話",
  c:"#4a8fd0",c1:"#8cc0ee",c2:"#25578a",art:"__C3__",
  sum:"運動會和參觀電視臺碰上同一天。爸爸教兒子在兩難的時候，怎樣冷靜思考、做出抉擇。",
  href:"https://teacherqq.github.io/teaching/y9b3u2-03/",},
 {id:"04",num:"四",kicker:"第四課 · 電子郵件",title:"給表哥的電子郵件",genre:"電郵",
  c:"#8d6fd6",c1:"#bfa9f0",c2:"#53389a",art:"__C4__",
  sum:"升上中學後科目變多、成績下滑，「我」寫電子郵件向梓軒表哥訴說煩惱。",
  href:"https://teacherqq.github.io/teaching/y9b3u2-04/",}
].map(L=>({...L,href:L.ready===false?null:L.href}));

const fan=document.getElementById('fan'),stage=document.getElementById('stage'),detail=document.getElementById('detail'),aura=document.getElementById('aura');
const N=LESSONS.length,MID=(N-1)/2;
const slots=LESSONS.map((L,i)=>{
  const live=!!L.href;
  const el=document.createElement(live?'a':'div');
  el.className='slot';el.style.setProperty('--i',i);
  for(const k of ['c','c1','c2'])el.style.setProperty('--'+k,L[k]);
  if(live){el.href=L.href;el.target='_blank';el.rel='noopener'}else{el.tabIndex=0;el.setAttribute('role','link');el.setAttribute('aria-disabled','true')}
  el.setAttribute('aria-label',L.title+(live?'':'（即將上線）'));
  const plates=Array.from({length:7},(_,k)=>`<div class="plate" style="--k:${7-k}"></div>`).join('');
  const body=`<div class="win${L.art?'':' dots'}">`+(L.art?`<div class="art" style="background-image:url('${L.art}');--pos:${L.pos||'center top'}"></div>`:`<div class="glyph">${L.glyph}</div><div class="soon">即將上線</div>`)+`</div>`;
  el.innerHTML=`<div class="deal"><div class="bob"><div class="card">${plates}
    <div class="face">${body}<div class="txt"><h3>${L.card||L.title}</h3><p>${L.cardSub||L.kicker}</p></div><div class="sheen"></div><div class="glare"></div></div>
    <div class="pop tag">${L.genre}</div></div></div></div>`;
  fan.appendChild(el);return el;
});

let hot=null,shown=-1,cw=200,sp=150,lastType='mouse';
function measure(){
  cw=slots[0].offsetWidth;
  const w=stage.clientWidth;
  sp=Math.min(cw*.8,(w-cw*1.2)/(N-1));
}
function layout(){
  const P=Math.max(0,cw*1.02-sp);
  const push=[0,1,.62,.38,.24];
  slots.forEach((el,i)=>{
    const d0=i-MID;
    let x=d0*sp,y=d0*d0*9,rz=d0*4.5,ry=-d0*7,z=-Math.abs(d0)*14,s=1,zi=20-Math.abs(i-MID)|0;
    if(hot!==null){
      const d=i-hot;
      if(d===0){y=-38;rz=0;ry=0;z=60;s=1.14;zi=50}
      else{x+=Math.sign(d)*P*push[Math.min(Math.abs(d),4)];rz+=Math.sign(d)*2;ry+=-Math.sign(d)*4;y+=6;zi=30-Math.abs(d)}
    }
    el.style.zIndex=zi;
    el.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateZ(${rz}deg) rotateY(${ry}deg) scale(${s})`;
    el.classList.toggle('on',i===hot);
    if(i!==hot){const c=el.querySelector('.card');c.style.removeProperty('--rx');c.style.removeProperty('--ry')}
  });
  renderDetail(hot===null?0:hot);
  aura.style.setProperty('--glow',LESSONS[hot===null?0:hot].c);
  document.documentElement.style.setProperty('--glow',LESSONS[hot===null?0:hot].c);
}
function renderDetail(i){
  if(i===shown)return;shown=i;const L=LESSONS[i];
  detail.innerHTML=`<div class="num fade">${L.num}</div><div class="k fade">${L.kicker}</div><h2 class="fade">${L.title}</h2><p class="fade">${L.sum}</p>
   <div class="row fade">${L.href?`<a class="go" href="${L.href}" target="_blank" rel="noopener">進入課件 →</a>`:`<span class="go" aria-disabled="true">即將上線</span>`}
   <span class="hint">${matchMedia('(hover:hover)').matches?'移動滑鼠瀏覽，點擊卡片進入':'輕點卡片預覽，再點一次進入'}</span></div>`;
}
function setHot(i){if(i!==hot){hot=i;layout()}}

// Hover is decided by the pointer's column over the fan's resting positions, so pushed neighbours never steal it.
function indexAt(e){
  const r=stage.getBoundingClientRect(),cx=r.left+r.width/2;
  return Math.max(0,Math.min(N-1,Math.round((e.clientX-cx)/sp+MID)));
}
stage.addEventListener('pointermove',e=>{
  lastType=e.pointerType;if(e.pointerType!=='mouse')return;
  const r=stage.getBoundingClientRect(),cy=r.top+r.height/2;
  if(Math.abs(e.clientY-cy)>cw*1.42*.75){setHot(null);return}
  const i=indexAt(e);setHot(i);
  // tilt + glare on the lifted card
  const cx=r.left+r.width/2+(i-MID)*sp,px=(e.clientX-cx)/(cw*1.14),py=(e.clientY-(cy-38))/(cw*1.42*1.14);
  const card=slots[i].querySelector('.card');
  card.style.setProperty('--ry',(px*16).toFixed(2)+'deg');card.style.setProperty('--rx',(-py*12).toFixed(2)+'deg');
  card.style.setProperty('--gx',((px+.5)*100).toFixed(1)+'%');card.style.setProperty('--gy',((py+.5)*100).toFixed(1)+'%');
});
stage.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')setHot(null)});
stage.addEventListener('pointerdown',e=>{lastType=e.pointerType});
slots.forEach((el,i)=>{
  el.addEventListener('click',e=>{
    if(lastType!=='mouse'&&hot!==i){e.preventDefault();setHot(i);return}
    if(!LESSONS[i].href){e.preventDefault();el.classList.remove('nudge');void el.offsetWidth;el.classList.add('nudge')}
  });
  el.addEventListener('focus',()=>setHot(i));
  el.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();slots[(i+(e.key==='ArrowRight'?1:N-1))%N].focus()}
  });
});
addEventListener('resize',()=>{measure();layout()});
if(!matchMedia('(hover:hover)').matches)hot=0;
measure();layout();

// fullscreen toggle (button + F key); hidden where the browser has no Fullscreen API, e.g. iPhone Safari
(()=>{
  const de=document.documentElement,b=document.getElementById('fs'),t=document.getElementById('fst'),ic=document.getElementById('fsi');
  const req=de.requestFullscreen||de.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  if(!req)return;b.hidden=false;
  const on=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const sync=()=>{const f=on();t.textContent=f?'退出全螢幕':'全螢幕';b.setAttribute('aria-label',t.textContent);
    ic.setAttribute('d',f?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5')};
  const toggle=()=>{try{const r=on()?exit.call(document):req.call(de);r&&r.catch&&r.catch(()=>{})}catch(e){}};
  b.addEventListener('click',toggle);
  addEventListener('keydown',e=>{if((e.key==='f'||e.key==='F')&&!e.metaKey&&!e.ctrlKey&&!e.altKey)toggle()});
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);
})();

// drifting dust
(()=>{
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=document.getElementById('dust'),ctx=cv.getContext('2d');let W,H,dpr;
  const P=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.3,v:Math.random()*.00025+.00008,a:Math.random()*.5+.15,p:Math.random()*6}));
  function size(){dpr=devicePixelRatio||1;W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}
  size();addEventListener('resize',size);
  (function tick(t){
    ctx.clearRect(0,0,W,H);
    for(const p of P){p.y-=p.v;if(p.y<-.02){p.y=1.02;p.x=Math.random()}
      const tw=.6+.4*Math.sin(t/900+p.p);ctx.beginPath();ctx.arc((p.x+Math.sin(t/4000+p.p)*.01)*W,p.y*H,p.r*dpr,0,7);
      ctx.fillStyle=`rgba(255,226,190,${p.a*tw})`;ctx.fill()}
    requestAnimationFrame(tick)
  })(0);
})();
</script>
